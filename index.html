  /* Nye aktiviteter og tydelig opdeling af afkodning og læseforståelse */
.filter-bar{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 21px}
.filter-button{border:2px solid #d4dfeb;border-radius:999px;padding:11px 17px;background:#fff;color:#1b3557;font-size:15px;font-weight:850}
.filter-button.active{background:#19274a;border-color:#19274a;color:#fff}
.filter-button:hover{border-color:#647b9b}
.filter-count{display:inline-block;font-size:12px;opacity:.78;margin-left:6px}
.game-card .tag.decode{background:#e3f4fc;color:#255c79}
.game-card .tag.comprehension{background:#fff0d6;color:#835a1b}
.game-card{min-height:283px}
.game-card .new-label{align-self:flex-end;font-size:12px;font-weight:900;background:#fff2ca;border-radius:99px;padding:3px 9px;color:#71521b;margin-top:-4px;margin-bottom:8px}
.double-highlight{background:#ffe187;border-radius:7px;padding:0 2px;box-decoration-break:clone}
.word-reveal{font-size:clamp(36px,6vw,52px);font-weight:950;letter-spacing:.03em;margin:17px auto 0}
.reason{color:#315d56;font-weight:750;font-size:16px}
.center-actions{justify-content:center}
.syllable-drop{min-height:102px}
.sort-word{display:inline-block;background:#f9d773;color:#1e2e4d;font-size:clamp(35px,6vw,56px);font-weight:950;border:3px solid #dba931;border-radius:21px;box-shadow:0 6px 0 #b88a20;padding:20px 35px;margin:12px 0 29px;cursor:grab;user-select:none}
.sort-bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:10px auto 25px;max-width:740px}
.sort-bin{background:#f0f6ff;border:3px dashed #8ea6cc;border-radius:20px;padding:19px 8px;min-height:112px;color:#173659;display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center}
.sort-bin span{font-size:13px;font-weight:780;color:#536f91}
.sort-bin strong{font-size:clamp(26px,4vw,40px);line-height:1.2}
.sort-bin:hover,.sort-bin.drag-over{background:#d8f2e6;border-color:#138676}
.sort-bin.selected{border-style:solid;border-color:#16886d;background:#d8f8e6}
.sentence-track{min-height:115px;border:3px dashed #8aa6c6;background:#f6faff;border-radius:20px;margin:18px 0;padding:14px;display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.train-wagon{border:2px solid #e1b65b;background:#fff2c4;color:#294264;font-size:clamp(17px,2.5vw,23px);font-weight:860;padding:12px 15px;border-radius:12px;box-shadow:0 4px 0 #dfc484}
.train-wagon:hover{background:#ffe59a}
.word-tiles .word-piece{font-size:clamp(16px,2.5vw,23px);min-width:0;min-height:57px;padding:10px 15px}
.evidence-note{margin:17px 0 4px;background:#eaf7ee;border-left:5px solid #1c916f;border-radius:13px;padding:15px;color:#245e49;font-size:15px}
.evidence-note p{margin:7px 0 0;font-size:15px;white-space:normal}
.text-mark{background:#ffe18d;padding:0 2px;border-radius:3px;color:#293f49}

function renderGame(){const cfg=CONFIG.find(c=>c.id===active);const total=countTotal();const current=active==='maze'?game.caught:game.index;return `<main><div class="play-top"><button class="back" onclick="goHome()">← Alle spil</button><div class="meter"><span>⭐ ${game.score} sikre svar</span>${active==='maze'?`<span>❤️ ${game.lives} liv</span>`:''}</div></div><section class="play-head"><div><div class="prompt-label" style="color:#cfddff">DIN LÆSEMISSION</div><h1>${cfg.icon} ${esc(cfg.name)}</h1><p>${esc(cfg.intro)}</p></div><div class="play-meta">${active==='maze'?`Fanget ${game.caught} af 5`:`Opgave ${game.index+1} af ${total}`}</div></section><div class="progress-track" role="progressbar" aria-label="Fremgang" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${current}"><div class="progress-fill" style="width:${Math.round(current/total*100)}%"></div></div><section class="play-panel">${({maze:renderMaze,onset:renderOnset,blend:renderBlend,picture:renderPicture,caption:renderCaption,story:renderStory,order:renderOrder,double:renderDouble,syllable:renderSyllable,sort:renderSort,sentence:renderSentence,infer:renderScenario,noise:renderScenario,vocab:renderScenario,compass:renderCompass})[active]()}</section></main>`;}
function feedbackHTML(){return game.message?`<div class="feedback ${game.feedbackType}" role="status"><span aria-hidden="true">${game.solved?'🌟':'💡'}</span><span>${esc(game.message)}</span></div>`:'';}

function renderFinish(){const cfg=CONFIG.find(c=>c.id===active),max=countTotal(),rate=game.score/max;const lines=rate>=.85?['Du læste virkelig opmærksomt!','Du brugte dine læsefærdigheder sikkert.']:rate>=.5?['Godt arbejdet!','Du løste mange opgaver. Prøv igen og se, hvad du opdager.']:['Du holdt fast!','Det vigtigste er, at du øvede dig. Prøv en runde mere med læsehjælp.'];return `<main><button class="back" onclick="goHome()">← Alle spil</button><section class="finish-wrap"><div class="finish-emoji" aria-hidden="true">${active==='maze'&&game.lives===0?'👻':rate>=.8?'🏆':'🌟'}</div><h1>${active==='maze'&&game.lives===0?'Spøgelset fangede dig!':'Mission gennemført!'}</h1><p>${lines[0]}<br>${lines[1]}</p><div class="finish-score">${game.score} af ${max} i første forsøg</div><p class="tiny-caption">Spillene er træning, ikke en læsetest. Du må altid prøve igen.</p><div class="finish-buttons"><button class="again" onclick="newGame('${active}')">Spil ${esc(cfg.name)} igen</button><button class="home" onclick="goHome()">Vælg et andet spil</button></div></section></main>`;}
function renderOnset(){const o=game.items[game.index];return `<div class="build-wrap text-center"><div class="prompt-label">KONSONANTFORBINDELSER</div><h2 class="prompt">Hvilke to bogstaver mangler først?</h2><div class="picture" role="img" aria-label="Billede til ordet ${esc(o.word)}">${o.icon}</div><div class="word-target"><span class="missing-part" aria-label="To bogstaver mangler">${game.solved?o.prefix:'__'}</span><span>${esc(o.ending)}</span></div><p class="instruction">Træk en brik op til ordet – eller tryk på den.</p><div class="drop-target" id="dropzone" data-drop="onset"><span class="drop-note">Slip forlyden her</span></div><div class="tiles">${shuffleStable(o.choices,game.index,'onset').map(s=>`<button class="piece" draggable="${!game.solved}" data-piece="${esc(s)}" type="button" onclick="answerOnset('${esc(s)}')" ${game.solved?'disabled':''}>${esc(s)}</button>`).join('')}</div><div class="small-actions" style="justify-content:center">${audioHTML(o.word)}${withHelp?`<button class="assist secondary" onclick="hintOnset()">💡 Et lille hint</button>`:''}</div>${feedbackHTML()}${nextHTML()}</div>`;}
function shuffleStable(arr,index,purpose){const seed=(index*7+purpose.length*13)%17;return arr.map((x,i)=>({x,n:(i*13+seed*3)%17})).sort((a,b)=>a.n-b.n).map(z=>z.x);}
function answerOnset(s){if(game.solved)return;const o=game.items[game.index];if(s===o.prefix)correct('Ja! '+o.prefix+' + '+o.ending+' = '+o.word+'. Prøv at sige ordet langsomt.');else wrong('Du valgte "'+s+'". Prøv at høre, hvilke to lyde ordet begynder med.');}

function setupBlend(){const o=game.items[game.index];game.blendTiles=shuffle([...o.parts,...o.extra].map((text,i)=>({id:i,text})));game.placed=[];}
function renderBlend(){const o=game.items[game.index];const placed=game.placed||[];return `<div class="build-wrap text-center"><div class="prompt-label">LYDERING OG LYDSYNTESE</div><h2 class="prompt">Lyt, sig lydene, og byg ordet</h2><div class="picture" role="img" aria-label="Billede: ${esc(o.word)}">${o.icon}</div><p class="instruction">Tryk på bogstavbrikkerne i rigtig rækkefølge. Du kan også trække dem ned i feltet.</p><div class="small-actions" style="justify-content:center">${audioHTML(o.word)}${withHelp?`<button class="assist secondary" onclick="blendHint()">💡 Hjælp til første lyd</button>`:''}</div><div id="dropzone" class="drop-target" data-drop="blend">${placed.length?placed.map((id,i)=>`<button class="tile-in-slot" type="button" onclick="removeBlend(${i})" aria-label="Fjern ${esc(game.blendTiles.find(x=>x.id===id).text)}">${esc(game.blendTiles.find(x=>x.id===id).text)} ×</button>`).join(''):`<span class="drop-note">Dit ord bygges her …</span>`}</div><div class="tiles">${game.blendTiles.map(tile=>`<button class="piece ${placed.includes(tile.id)?'used':''}" type="button" draggable="${!placed.includes(tile.id)&&!game.solved}" data-piece="${tile.id}" onclick="pickBlend(${tile.id})" aria-label="Vælg ${esc(tile.text)}" ${game.solved||placed.includes(tile.id)?'disabled':''}>${esc(tile.text)}</button>`).join('')}</div><div class="check-actions"><button class="assist" onclick="clearBlend()" ${game.solved?'disabled':''}>↺ Start ordet forfra</button><button class="next-btn" style="margin-top:0" onclick="checkBlend()" ${game.solved?'disabled':''}>Tjek mit ord ✓</button></div>${feedbackHTML()}${nextHTML()}</div>`;}
function pickBlend(id){if(game.solved||game.placed.includes(id))return;game.placed.push(id);game.message='';render();}
function removeBlend(i){if(game.solved)return;game.placed.splice(i,1);game.message='';render();}
function clearBlend(){game.placed=[];game.message='';render();}
function checkBlend(){if(game.solved)return;const o=game.items[game.index];const result=game.placed.map(id=>game.blendTiles.find(t=>t.id===id).text);if(result.join('')===o.word && result.length===o.parts.length && result.every((p,i)=>p===o.parts[i]))correct('Flot! '+o.parts.join(' – ')+' bliver til '+o.word+'.');else wrong('Det blev ikke helt ordet endnu. Lyt igen og prøv at samle lydene i rækkefølge.');}
function blendHint(){const o=game.items[game.index];feedback('Ordet starter med "'+o.parts[0]+'". Hvad hører du bagefter?','');}
function renderPicture(){const o=game.items[game.index];return `<div class="text-center"><div class="prompt-label">PRÆCIS AFKODNING</div><h2 class="prompt">Hvilket ord passer til billedet?</h2><div class="picture" role="img" aria-label="Billede: ${esc(o.word)}">${o.icon}</div><p class="instruction">Læs alle bogstaverne. Nogle af ordene ligner hinanden.</p><div class="answers">${shuffleStable(o.options,game.index,'picture').map(s=>`<button class="answer-btn ${game.solved&&s===o.word?'correct':''}" onclick="chooseSimple(${JSON.stringify(s).replaceAll('"','&quot;')})" ${game.solved?'disabled':''}>${esc(s)}</button>`).join('')}</div>${withHelp?`<div class="small-actions" style="justify-content:center">${audioHTML(o.word)}<button class="assist secondary" onclick="feedback('Se især på første og sidste bogstav. Læs hele ordet – ikke kun begyndelsen.','')">💡 Tip</button></div>`:''}${feedbackHTML()}${nextHTML()}</div>`;}
function renderCaption(){const o=game.items[game.index];return `<div class="text-center"><div class="prompt-label">SÆTNING OG BETYDNING</div><h2 class="prompt">Hvilken sætning passer til billedet?</h2><div class="picture" style="width:min(330px,100%);height:160px;font-size:70px;white-space:nowrap" role="img" aria-label="Billede med to ting">${o.scene}</div><p class="instruction">Læs de fire sætninger langsomt. En af dem passer helt præcist.</p><div class="answers">${shuffleStable(o.options,game.index,'caption').map(s=>`<button class="answer-btn ${game.solved&&s===o.correct?'correct':''}" style="font-size:17px;text-align:left" onclick="chooseSimple(${JSON.stringify(s).replaceAll('"','&quot;')})" ${game.solved?'disabled':''}>${esc(s)}</button>`).join('')}</div>${feedbackHTML()}${nextHTML()}</div>`;}
function chooseSimple(value){if(game.solved)return;const o=game.items[game.index];const right=active==='picture'?o.word:o.correct;if(value===right)correct('Lige præcis! Du læste alle detaljerne.');else wrong('Næsten. Sammenlign ordene med billedet, og prøv igen.');}
function renderStory(){const si=Math.floor(game.index/4),qi=game.index%4;const st=STORIES[si],q=st.qs[qi];return `<div class="story-layout"><article class="reading-sheet"><div class="sheet-label">${esc(st.kind)} · tekst ${si+1} af 3</div><h2>${esc(st.title)}</h2><p>${esc(st.text)}</p><div class="small-actions">${audioHTML(st.text)}</div></article><div class="question-sheet"><span class="level-pill">${esc(q.kind)}</span><div class="prompt-label" style="margin-top:14px">SPØRGSMÅL ${qi+1} AF 4</div><h2 class="prompt" style="font-size:23px">${esc(q.q)}</h2>${withHelp?`<div class="small-actions"><button class="assist" onclick="speak(${JSON.stringify(q.q).replaceAll('"','&quot;')})">🔊 Hør spørgsmålet</button><button class="assist secondary" onclick="storyHint()">💡 Hjælp mig med at finde svaret</button></div>`:''}<div class="answers">${shuffleStable(q.options,game.index,'story').map(s=>`<button class="answer-btn ${game.solved&&s===q.correct?'correct':''}" onclick="answerStory(${JSON.stringify(s).replaceAll('"','&quot;')})" ${game.solved?'disabled':''}>${esc(s)}</button>`).join('')}</div>${feedbackHTML()}${nextHTML()}</div></div>`;}
function answerStory(value){if(game.solved)return;const q=STORIES[Math.floor(game.index/4)].qs[game.index%4];if(value===q.correct)correct('Rigtigt! Du fandt et godt svar i teksten.');else wrong('Læs det relevante sted igen. Brug gerne hint-knappen.');}
function storyHint(){const q=STORIES[Math.floor(game.index/4)].qs[game.index%4];feedback(q.hint,'');}
function setupOrder(){if(!game)return;const ordered=ORDERS[game.index].sentences.map((text,id)=>({text,id}));game.order=shuffle(ordered);if(game.order.every((it,i)=>it.id===i))game.order.reverse();}
function renderOrder(){const o=ORDERS[game.index];return `<div class="build-wrap"><div class="prompt-label">RÆKKEFØLGE OG SAMMENHÆNG</div><h2 class="prompt">Hvad skete først, og hvad skete til sidst?</h2><p class="instruction">Historie: <b>${esc(o.title)}</b>. Flyt sætningerne med pilene, eller træk dem op og ned. Nummer 1 skal ske først.</p><div class="sentence-list" id="order-list">${game.order.map((it,i)=>`<div class="sentence-item" draggable="${!game.solved}" data-order-index="${i}"><span class="sentence-num">${i+1}</span><span class="sentence-text">${esc(it.text)}</span><span class="move-buttons"><button class="move-btn" aria-label="Flyt sætning ${i+1} op" onclick="moveOrder(${i},-1)" ${i===0||game.solved?'disabled':''}>↑</button><button class="move-btn" aria-label="Flyt sætning ${i+1} ned" onclick="moveOrder(${i},1)" ${i===game.order.length-1||game.solved?'disabled':''}>↓</button></span></div>`).join('')}</div><div class="small-actions">${withHelp?`<button class="assist" onclick="speak(${JSON.stringify(game.order.map(o=>o.text).join(' ')).replaceAll('"','&quot;')})">🔊 Hør sætningerne</button><button class="assist secondary" onclick="feedback('Find begyndelsen, så det der sker bagefter, og til sidst slutningen.','')">💡 Hint</button>`:''}</div><div class="check-actions"><button class="next-btn" style="margin-top:0" onclick="checkOrder()" ${game.solved?'disabled':''}>Tjek min rækkefølge ✓</button></div>${feedbackHTML()}${nextHTML()}</div>`;}
function moveOrder(i,delta){if(game.solved)return;const j=i+delta;if(j<0||j>=game.order.length)return;[game.order[i],game.order[j]]=[game.order[j],game.order[i]];game.message='';render();}
function checkOrder(){if(game.solved)return;if(game.order.every((it,i)=>it.id===i))correct('Ja! Begyndelsen, midten og slutningen hænger sammen.');else wrong('Prøv igen. Hvad skal være sket, før den næste sætning giver mening?');}
function mazeWalkable(x,y){return x>=0&&y>=0&&y<MAZE.length&&x<MAZE[0].length&&MAZE[y][x]==='.';}
function setupMaze(){game.caught=0;game.lives=3;game.turns=0;game.player={x:1,y:1};game.ghost={x:9,y:7};game.words=new Map();const targets=shuffle(WORD_BANKS[game.cluster]).slice(0,5);const distractors=shuffle(Object.entries(WORD_BANKS).filter(([k])=>k!==game.cluster).flatMap(([k,words])=>words.slice(0,2))).slice(0,4);const choices=shuffle([...targets.map(w=>({w,good:true})),...distractors.map(w=>({w,good:false}))]);const spots=shuffle(MAZE_SPOTS).slice(0,choices.length);choices.forEach((obj,i)=>game.words.set(spots[i].join(','),obj));game.message='';game.feedbackType='';game.solved=false;game.score=0;}
function chooseCluster(value){game.cluster=value;setupMaze();render();}
function renderMaze(){let cells='';for(let y=0;y<MAZE.length;y++)for(let x=0;x<MAZE[y].length;x++){const wall=MAZE[y][x]==='#';const w=game.words.get(x+','+y);const hero=game.player.x===x&&game.player.y===y;const ghost=game.ghost.x===x&&game.ghost.y===y;cells+=`<div class="cell ${wall?'wall':'floor'}" aria-label="${wall?'Væg':w?'Ord '+w.w:'Gang'}">${w?`<span class="maze-word">${esc(w.w)}</span>`:''}${hero?`<span class="pac" aria-label="Din figur"></span>`:''}${ghost?`<span class="ghost" aria-label="Spøgelse">👻</span>`:''}</div>`;}return `<div class="maze-intro"><div><div class="prompt-label">ORDLABYRINTEN</div><h2 class="prompt" style="margin-bottom:3px">Fang 5 ord med <b>${game.cluster}</b></h2><p class="instruction" style="margin-bottom:0">Gå hen på de rigtige ord. Brug piletasterne eller pilene på skærmen.</p></div><label for="cluster"><b>Vælg forlyd: </b><select id="cluster" class="cluster-picker" onchange="chooseCluster(this.value)">${Object.keys(WORD_BANKS).map(s=>`<option value="${s}" ${s===game.cluster?'selected':''}>${s}</option>`).join('')}</select></label></div><div class="maze-zone"><div class="maze-board" role="img" aria-label="Ord-labyrint med veje, ord og en spiller. Brug piletaster eller knapper." id="maze-board">${cells}</div><aside class="maze-side"><div><strong>🟡 Din mission</strong><div class="goal">${game.caught} / 5 rigtige ord fundet</div><div class="hearts" aria-label="${game.lives} liv tilbage">${'❤️'.repeat(game.lives)}${'🤍'.repeat(3-game.lives)}</div><p>Et forkert ord giver et nyt forsøg. Spøgelset tager et liv, hvis det fanger dig.</p><div class="maze-log" role="status">${esc(game.message||'Find ordene med '+game.cluster+'. Held og lykke!')}</div></div><div><div class="dpad" aria-label="Styr din figur"><button aria-label="Op" onclick="moveMaze(0,-1)">↑</button><button aria-label="Venstre" onclick="moveMaze(-1,0)">←</button><button aria-label="Højre" onclick="moveMaze(1,0)">→</button><button aria-label="Ned" onclick="moveMaze(0,1)">↓</button></div>${withHelp?`<button class="assist" onclick="speak('Find fem ord der begynder med ${game.cluster}')">🔊 Hør din mission</button>`:''}</div></aside></div>`;}
function moveMaze(dx,dy){if(active!=='maze'||game.finished)return;const nx=game.player.x+dx,ny=game.player.y+dy;if(!mazeWalkable(nx,ny))return;game.player={x:nx,y:ny};game.turns++;const here=game.words.get(nx+','+ny);if(here){if(here.good){game.words.delete(nx+','+ny);game.caught++;game.score++;game.message='Flot! "'+here.w+'" starter med '+game.cluster+'.';if(game.caught>=5){finish();return;}}else{game.message='"'+here.w+'" starter ikke med '+game.cluster+'. Find et andet ord.';}}
 if(game.turns%(withHelp?5:3)===0)moveGhost();if(game.ghost.x===game.player.x&&game.ghost.y===game.player.y){game.lives--;game.player={x:1,y:1};game.ghost={x:9,y:7};game.message='Hov, spøgelset fik dig! Du har '+game.lives+' liv tilbage.';if(game.lives<=0){game.finished=true;stats.maze={best:Math.max(stats.maze?.best||0,game.caught),last:game.caught,total:5,plays:(stats.maze?.plays||0)+1};save();}}
 render();}
function moveGhost(){const {x,y}=game.ghost;const dirs=[[1,0],[-1,0],[0,1],[0,-1]];const possible=dirs.map(([dx,dy])=>({x:x+dx,y:y+dy})).filter(p=>mazeWalkable(p.x,p.y));if(!possible.length)return;const chasing=Math.random()<(withHelp?.18:.38);const chosen=chasing?[...possible].sort((a,b)=>(Math.abs(a.x-game.player.x)+Math.abs(a.y-game.player.y))-(Math.abs(b.x-game.player.x)+Math.abs(b.y-game.player.y)))[0]:shuffle(possible)[0];game.ghost=chosen;}
function attachDrags(){const drop=document.querySelector('[data-drop]');if(drop){drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag-over');});drop.addEventListener('dragleave',()=>drop.classList.remove('drag-over'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag-over');const value=e.dataTransfer.getData('text/plain');if(active==='onset')answerOnset(value);if(active==='blend'&&value!=='')pickBlend(Number(value));});document.querySelectorAll('[data-piece]').forEach(el=>el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.piece);e.dataTransfer.effectAllowed='move';}));}
 const list=document.getElementById('order-list');if(list){let origin=null;list.querySelectorAll('[data-order-index]').forEach(el=>{el.addEventListener('dragstart',e=>{origin=Number(el.dataset.orderIndex);e.dataTransfer.setData('text/plain',String(origin));});el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over');});el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drag-over');const from=Number(e.dataTransfer.getData('text/plain'));const to=Number(el.dataset.orderIndex);if(!Number.isInteger(from)||from<0||from>=game.order.length||from===to)return;const [item]=game.order.splice(from,1);game.order.splice(to,0,item);game.message='';render();});});}
}
document.addEventListener('keydown',e=>{if(active!=='maze'||game?.finished)return;if(document.activeElement?.tagName==='SELECT')return;const keys={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};if(keys[e.key]){e.preventDefault();moveMaze(...keys[e.key]);}});
// Tilføjede interaktive spil. Click/touch er altid et alternativ til drag-and-drop.
function setCategory(category){homeCategory=category;render();const el=document.getElementById('games');if(el)el.scrollIntoView({block:'start'});}
function gameLabel(){return active==='double'?'DOBBELTKONSONANTER':active==='syllable'?'STAVELSESRAKETTEN':active==='sort'?'FORLYDSSORTERING':active==='sentence'?'SÆTNINGSTOGET':active==='infer'?'LÆS MELLEM LINJERNE':active==='noise'?'HOLD FAST I DET RIGTIGE':active==='vocab'?'ORD I SAMMENHÆNG':'TEKSTKOMPASSET';}
function optionsHTML(options,correctValue,onAnswer,small=false){return `<div class="answers">${shuffleStable(options,game.index,active+'extra').map(s=>`<button type="button" class="answer-btn ${game.solved&&s===correctValue?'correct':''}" style="${small?'font-size:17px;text-align:left;':''}" onclick="${onAnswer}(${JSON.stringify(s).replaceAll('"','&quot;')})" ${game.solved?'disabled':''}>${esc(s)}</button>`).join('')}</div>`;}
function renderDouble(){const o=game.items[game.index];const emphasized=esc(o.word).replace(/(.)\1/ig,'<span class="double-highlight">$&</span>');return `<div class="build-wrap text-center"><div class="prompt-label">${gameLabel()}</div><h2 class="prompt">Hvilket ord er stavet rigtigt?</h2><div class="picture" role="img" aria-label="Billede til ordet ${esc(o.word)}">${o.icon}</div><p class="instruction">Læs hele ordet. Se ekstra godt på de bogstaver, der står to af.</p>${optionsHTML(o.options,o.word,'answerDouble')}${withHelp?`<div class="small-actions center-actions">${audioHTML(o.word)}<button class="assist secondary" onclick="feedback('Se på ordets midte. Er der et bogstav, som skal stå to gange?','')">💡 Hjælp</button></div>`:''}${game.solved?`<div class="word-reveal">${emphasized}</div><p class="reason">${esc(o.reason)}</p>`:''}${feedbackHTML()}${nextHTML()}</div>`;}
function answerDouble(value){if(game.solved)return;const o=game.items[game.index];if(value===o.word)correct('Ja! Nu fandt du den rigtige stavemåde.');else wrong('Prøv igen. Læs ordet fra start til slut, og se på bogstaverne i midten.');}
function setupSyllable(){const o=game.items[game.index];game.syllableTiles=shuffle([...o.parts,...o.extras].map((text,id)=>({text,id})));game.syllablePlaced=[];}
function pickSyllable(id){if(game.solved||game.syllablePlaced.includes(id))return;game.syllablePlaced.push(id);game.message='';render();}
function removeSyllable(i){if(game.solved)return;game.syllablePlaced.splice(i,1);game.message='';render();}
function resetSyllable(){if(game.solved)return;game.syllablePlaced=[];game.message='';render();}
function checkSyllable(){if(game.solved)return;const o=game.items[game.index],got=game.syllablePlaced.map(id=>game.syllableTiles.find(t=>t.id===id).text);if(got.join('')===o.word && got.length===o.parts.length && got.every((s,i)=>s===o.parts[i]))correct('Fint! '+o.parts.join(' – ')+' bliver til '+o.word+'.');else wrong('Det blev ikke helt ordet. Prøv at sige hver stavelse og flyt eventuelt en brik.');}
function renderSyllable(){const o=game.items[game.index];return `<div class="build-wrap text-center"><div class="prompt-label">${gameLabel()}</div><h2 class="prompt">Saml stavelserne til et ord</h2><div class="picture compact" role="img" aria-label="Billede af ${esc(o.word)}">${o.icon}</div><p class="instruction">Vælg stavelserne i den rigtige rækkefølge. Du kan trykke på dem eller trække dem op i feltet.</p><div class="drop-target syllable-drop" data-syllable-drop="true" aria-label="Dit ord">${game.syllablePlaced.length?game.syllablePlaced.map((id,i)=>`<button class="tile-in-slot" onclick="removeSyllable(${i})" ${game.solved?'disabled':''} aria-label="Fjern stavelsen ${esc(game.syllableTiles.find(t=>t.id===id).text)}">${esc(game.syllableTiles.find(t=>t.id===id).text)}</button>`).join(''):'<span class="drop-note">Byg dit ord her</span>'}</div><div class="tiles">${game.syllableTiles.filter(t=>!game.syllablePlaced.includes(t.id)).map(t=>`<button type="button" class="piece syllable-piece" draggable="${!game.solved}" data-syllable-id="${t.id}" onclick="pickSyllable(${t.id})" ${game.solved?'disabled':''}>${esc(t.text)}</button>`).join('')}</div><div class="small-actions center-actions">${audioHTML(o.word)}${withHelp?`<button class="assist secondary" onclick="feedback('Sig ordet langsomt, og klap rytmen. Hvor mange dele kan du høre?','')">💡 Klap ordet</button>`:''}<button class="assist" onclick="resetSyllable()" ${game.solved?'disabled':''}>↺ Start ordet forfra</button></div><button class="next-btn" onclick="checkSyllable()" ${game.solved?'disabled':''}>Tjek stavelserne ✓</button>${feedbackHTML()}${nextHTML()}</div>`;}
function answerSort(part){if(game.solved)return;const o=game.items[game.index];if(part===o.target)correct('Nemlig! '+o.word+' starter med '+o.target+'.');else wrong('Det er en anden forlyd. Sig '+o.word+' langsomt, og kig på de to første bogstaver.');}
function renderSort(){const o=game.items[game.index];return `<div class="build-wrap text-center"><div class="prompt-label">${gameLabel()}</div><h2 class="prompt">Hvilken station hører ordet til?</h2><p class="instruction">Træk ordkortet til den rigtige station. Du kan også bare trykke på en station.</p><div class="sort-word" draggable="${!game.solved}" data-sort-word="true" aria-label="Ordet ${esc(o.word)}">${esc(o.word)}</div><div class="sort-bins">${o.options.map(c=>`<button type="button" class="sort-bin ${game.solved&&c===o.target?'selected':''}" data-sort-bin="${c}" onclick="answerSort('${c}')" ${game.solved?'disabled':''}><span>Station</span><strong>${c}</strong></button>`).join('')}</div><p class="instruction">To bogstaver i begyndelsen kaldes her en <b>konsonantforbindelse</b>, fx sk, sp og st.</p>${withHelp?`<div class="small-actions center-actions">${audioHTML(o.word)}<button class="assist secondary" onclick="feedback('Læs de to første bogstaver. Sammenlign dem med stationerne.','')">💡 Tip</button></div>`:''}${feedbackHTML()}${nextHTML()}</div>`;}
function setupSentence(){const o=game.items[game.index];game.sentenceTiles=shuffle(o.parts.map((word,id)=>({word,id})));game.sentencePlaced=[];}
function pickSentence(id){if(game.solved||game.sentencePlaced.includes(id))return;game.sentencePlaced.push(id);game.message='';render();}
function removeSentence(i){if(game.solved)return;game.sentencePlaced.splice(i,1);game.message='';render();}
function checkSentence(){if(game.solved)return;const o=game.items[game.index];if(game.sentencePlaced.length===o.parts.length && game.sentencePlaced.every((id,i)=>id===i))correct('Flot! Nu kan hele sætningen læses: '+o.parts.join(' '));else wrong('Læs sætningen højt. Hvem gør noget? Hvad sker der? Flyt en brik, hvis noget lyder forkert.');}
function renderSentence(){const o=game.items[game.index];return `<div class="build-wrap text-center"><div class="prompt-label">${gameLabel()}</div><h2 class="prompt">Kør sætningstoget!</h2><div class="picture" style="width:min(290px,100%);height:130px;font-size:67px;white-space:nowrap" role="img" aria-label="Billede, der passer til sætningen">${o.icon}</div><p class="instruction">${esc(o.prompt)} Tryk på ordene i den rækkefølge, de skal stå.</p><div class="sentence-track" aria-label="Din sætning">${game.sentencePlaced.length?game.sentencePlaced.map((id,i)=>`<button class="train-wagon" type="button" onclick="removeSentence(${i})" ${game.solved?'disabled':''}>${esc(game.sentenceTiles.find(t=>t.id===id).word)}</button>`).join(''):'<span class="drop-note">Dit sætningstog kommer her ...</span>'}</div><div class="tiles word-tiles">${game.sentenceTiles.filter(t=>!game.sentencePlaced.includes(t.id)).map(t=>`<button type="button" class="piece word-piece" onclick="pickSentence(${t.id})" ${game.solved?'disabled':''}>${esc(t.word)}</button>`).join('')}</div>${withHelp?`<div class="small-actions center-actions"><button class="assist secondary" onclick="feedback('Begynd med navnet eller den, der gør noget. Slut med ordet, der har punktum.','')">💡 Sætningen skal give mening</button></div>`:''}<button class="next-btn" onclick="checkSentence()" ${game.solved?'disabled':''}>Tjek min sætning ✓</button>${feedbackHTML()}${nextHTML()}</div>`;}
function textHighlight(s,evidence){const textEsc=esc(s),evEsc=esc(evidence||'');return game.solved&&evEsc?textEsc.replace(evEsc,`<mark class="text-mark">${evEsc}</mark>`):textEsc;}
function renderScenario(){const o=game.items[game.index],isInfer=active==='infer',isNoise=active==='noise';const intro=isInfer?'Find spor i teksten. Vælg det, du kan regne ud, selv om det ikke står direkte.':isNoise?'Vælg det, teksten faktisk siger. Pas på ændrede planer og små ord som »ikke«.':'Brug resten af sætningen til at regne ordets betydning ud.';return `<div class="story-layout"><article class="reading-sheet"><div class="sheet-label">${gameLabel()}</div><h2>${isInfer?'Find sporene':isNoise?'Læs meget nøje':'Hvad betyder ordet?'}</h2><p>${textHighlight(o.text,o.evidence)}</p><div class="small-actions">${audioHTML(o.text)}</div>${game.solved?`<div class="evidence-note"><b>🔎 Det vigtige spor</b><p>${esc(o.reason)}</p></div>`:''}</article><div class="question-sheet"><div class="prompt-label">SPØRGSMÅL ${game.index+1} AF ${countTotal()}</div><h2 class="prompt" style="font-size:24px">${esc(o.q)}</h2><p class="instruction">${esc(intro)}</p>${withHelp?`<div class="small-actions"><button class="assist" onclick="speak(${JSON.stringify(o.q).replaceAll('"','&quot;')})">🔊 Hør spørgsmålet</button><button class="assist secondary" onclick="scenarioHint()">💡 Find et spor</button></div>`:''}${optionsHTML(o.options,o.correct,'answerScenario',true)}${feedbackHTML()}${nextHTML()}</div></div>`;}
function answerScenario(value){if(game.solved)return;const o=game.items[game.index];if(value===o.correct)correct('Ja! Du brugte teksten til at finde det bedste svar.');else wrong(active==='infer'?'Prøv igen. Hvilke spor giver teksten?':active==='noise'?'Læs den sidste vigtige oplysning igen.':'Læs sætningen før og efter det svære ord.');}
function scenarioHint(){const o=game.items[game.index];feedback(o.hint,'');}
function renderCompass(){const o=game.items[game.index];const label={Find:'På linjen',Tænk:'Mellem linjerne',Forstå:'Hele teksten',Vurdér:'Tekstens form'}[o.kind];return `<div class="story-layout"><article class="reading-sheet"><div class="sheet-label">${esc(o.genre)} · tekst ${o.textNumber} af ${COMPASS_TEXTS.length}</div><h2>${esc(o.title)}</h2><p>${textHighlight(o.text,o.evidence)}</p><div class="small-actions">${audioHTML(o.text)}</div>${game.solved?`<div class="evidence-note"><b>📍 Sådan fandt vi svaret</b><p>${esc(o.reason)}</p></div>`:''}</article><div class="question-sheet"><span class="level-pill">${esc(o.kind)} · ${esc(label)}</span><h2 class="prompt" style="font-size:24px;margin-top:15px">${esc(o.q)}</h2><p class="instruction">${o.kind==='Find'?'Find ordene i teksten.':o.kind==='Tænk'?'Saml sporene og tænk videre.':o.kind==='Forstå'?'Tænk på hele teksten.':'Tænk på, hvorfor teksten er skrevet på den måde.'}</p>${withHelp?`<div class="small-actions"><button class="assist" onclick="speak(${JSON.stringify(o.q).replaceAll('"','&quot;')})">🔊 Hør spørgsmålet</button><button class="assist secondary" onclick="feedback('Læs teksten én gang mere. Find det sted, der hjælper dig bedst.','')">💡 Hjælp</button></div>`:''}${optionsHTML(o.options,o.correct,'answerCompass',true)}${feedbackHTML()}${nextHTML()}</div></div>`;}
function answerCompass(value){if(game.solved)return;const o=game.items[game.index];if(value===o.correct)correct('Ja! Godt læst.');else wrong('Det svar passer ikke helt til teksten. Find en oplysning, der kan hjælpe dig.');}
function attachExtraDrags(){
  const syl=document.querySelector('[data-syllable-drop]');
  if(syl){syl.addEventListener('dragover',e=>{e.preventDefault();syl.classList.add('drag-over');});syl.addEventListener('dragleave',()=>syl.classList.remove('drag-over'));syl.addEventListener('drop',e=>{e.preventDefault();syl.classList.remove('drag-over');const raw=e.dataTransfer.getData('text/plain');if(/^\d+$/.test(raw))pickSyllable(Number(raw));});document.querySelectorAll('[data-syllable-id]').forEach(el=>el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.syllableId);e.dataTransfer.effectAllowed='move';}));}
  const word=document.querySelector('[data-sort-word]');
  if(word){word.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain','sort-word');e.dataTransfer.effectAllowed='move';});document.querySelectorAll('[data-sort-bin]').forEach(el=>{el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('drag-over');});el.addEventListener('dragleave',()=>el.classList.remove('drag-over'));el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('drag-over');if(e.dataTransfer.getData('text/plain')==='sort-word')answerSort(el.dataset.sortBin);});});}
}

function showTeacher(){const html=`<div class="modal-back" role="presentation" onclick="closeTeacher(event)"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="teacher-heading"><div class="modal-head"><h2 id="teacher-heading">Til læreren · 3.C</h2><button class="close" onclick="closeTeacher()">✕ Luk</button></div><p>Værkstedet er tænkt til ekstra læsestøtte, ikke som en prøve. Eleverne møder én overskuelig opgave ad gangen, får mulighed for gentagelse og kan vælge oplæsning som støtte.</p><h3>Faglige mål</h3><ul><li><b>Afkodning:</b> Ordkikkerten træner præcis ordidentifikation med lydligt og visuelt nært beslægtede svar; Forlydsbyggeren og Ordlabyrinten arbejder med konsonantforbindelser.</li><li><b>Lydering:</b> Lydværkstedet træner at samle bogstaver og bogstavgrupper til hele ord.</li><li><b>Tekstforståelse:</b> Tekstjagten arbejder med eksplicitte oplysninger, slutninger, hovedindhold og refleksion over tekstens formål. Billeddetektiven og Historiebyggeren giver kortere indgange til sætningsforståelse og sammenhæng.</li></ul><h3>8 nye spil – sådan træner de</h3><ul><li><b>Afkodning:</b> Dobbeltkonsonantjagten (stavemønstre som mm, kk og pp), Stavelsesraketten (orddele og stavelsesdeling) og Forlydsstationen (sortering af konsonantforbindelser med træk eller klik).</li><li><b>Læseforståelse:</b> Sætningstoget (syntaks og sætningsmening), Inferensdetektiven (slutninger begrundet i tekstspor), Forstyrrelsesfilteret (modstå konkurrerende oplysninger, fx ændrede planer eller ordet »ikke«), Ordspor (ordforståelse ud fra kontekst) og Tekstkompasset (finde, fortolke, forstå helhed og vurdere tekstens form).</li></ul><p><b>Faglig præcisering:</b> Konsonantforbindelser i forlyd (sk, sp, st, br) er ikke det samme som dobbeltkonsonanter inde i ord (sommer, klokke). Inferens betyder at slutte sig til noget ud fra spor; interferens betyder her at uvedkommende eller konkurrerende oplysninger forstyrrer læsningen. Sidstnævnte er en øveaktivitet, ikke en selvstændig national testkategori.</p><h3>Forslag til 15 minutter</h3><p><b>Afkodning:</b> 5 min Ordkikkerten → 5 min Dobbeltkonsonantjagten → 5 min Stavelsesraketten eller Forlydsstationen. <b>Forståelse:</b> 5 min Sætningstoget → 5 min Inferensdetektiven → 5 min Forstyrrelsesfilteret. Udvid med Ordspor eller Tekstkompasset efter elevens behov.</p><h3>Differentiering og opfølgning</h3><ul><li><b>Hjælp til:</b> Oplæsning og hints kan bruges som stilladsering. <b>Hjælp fra:</b> Opgaven løses uden disse hjælpeknapper.</li><li>Spørg til elevens strategi: »Hvad i ordet gjorde, at du valgte det?« eller »Hvor i teksten fandt du dit svar?«</li><li>Registrér hellere mønstre i usikker afkodning end kun antal rigtige. Spilresultaterne må ikke forveksles med officielle testresultater. Antal rigtige i første forsøg er kun en lokal øveindikator, ikke en standardiseret vurdering.</li><li>Dansk tale bruger browserens oplæsning, hvis en dansk stemme er installeret. Modellér selv præcis bogstavlyd ved behov.</li></ul><h3>Kobling til Nationale Færdighedstest (2026/27)</h3><p>Den aktuelle nationale test i 3. klasse måler <b>afkodning og tekstforståelse</b>. I afkodning vælger elever på 3. klassetrin ord, der passer til et billede, blandt nært lignende alternativer; denne del af den officielle test varer 4 minutter. Her prioriteres derimod rolig, præcis træning uden tidspres. Tekstforståelse omfatter fire delprocesser: finde information, fortolke, forstå helheden og reflektere over indhold og form. Dette er <b>selvstændigt øvemateriale</b> og ikke officielle testopgaver. Hjælp og oplæsning er en del af denne træning, men gør ikke resultater sammenlignelige med testresultater.</p><p><a href="https://uvm.dk/grundskole/folkeskolen/laering-og-laeringsmiljoe/test-og-evalueringsredskaber/folkeskolens-nationale-faerdighedstest/centrale-faerdigheder-i-folkeskolens-nationale-faerdighedstest/folkeskolens-nationale-faerdighedstest-i-laesning/" target="_blank" rel="noopener">Læs ministeriets faglige beskrivelse ↗</a></p><h3>Datasikkerhed</h3><p>Værkstedet kræver ikke navn eller login. Resultater gemmes lokalt på den aktuelle browser og sendes ingen steder. På delte enheder anbefales det at rydde lokal statistik efter brug.</p><button class="close" onclick="clearStats()">Ryd alle lokale resultater</button></section></div>`;document.getElementById('modalRoot').innerHTML=html;document.querySelector('.modal .close')?.focus();}
function closeTeacher(e){if(e&&e.target!==e.currentTarget)return;document.getElementById('modalRoot').innerHTML='';}
function clearStats(){stats={};save();closeTeacher();render();announce('Lokale øveresultater er ryddet.');}
render();
