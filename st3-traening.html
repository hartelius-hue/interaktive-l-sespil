in sandwich på hans serviet.","w":"Den glemte madpakke forklarer Najas handling."},{"l":3,"p":"Hvorfor går Amira sandsynligvis tilbage?","o":["Hun vil hente bolden.","Hun vil spise.","Hun vil bygge et mål."],"a":"Hun vil hente bolden.","t":"Det blæser kraftigt. Alle løber ind, men Amira går tilbage mod målet. Bolden ligger alene på banen.","pro":["Bolden ligger alene på banen.","Det blæser.","Alle løber ind."],"proof":"Bolden ligger alene på banen.","w":"Den efterladte bold giver en sandsynlig forklaring."}]},{"id":"tekstkompas","g":"Læseforståelse","title":"Tekstkompasset","icon":"🧭","kind":"choice","desc":"Find oplysninger, hovedidé, hensigt og kritiske tekstspor.","qs":[{"l":1,"p":"Hvornår skal klassen mødes?","o":["Klokken ni.","Klokken ti.","På fredag."],"a":"Klokken ni.","w":"Svaret står direkte i teksten.","t":"På tirsdag går 3.C på biblioteket. Klassen mødes klokken ni ved hovedindgangen."},{"l":1,"p":"Hvad handler teksten især om?","o":["Kaninens kendetegn.","Et cykelløb.","Bagning."],"a":"Kaninens kendetegn.","w":"Alle sætninger handler om kaninen.","t":"Kaninen spiser mest planter. Den har lange ører og kan hoppe hurtigt."},{"l":1,"p":"Hvorfor er denne tekst skrevet?","o":["For at invitere.","For at fortælle eventyr.","For at forklare matematik."],"a":"For at invitere.","w":"Tidspunkt og aktiviteter er typiske for en invitation.","t":"Kom til åbent hus lørdag klokken 10–13. Se elevernes værker."},{"l":2,"p":"Hvad er tekstens vigtigste pointe?","o":["Bier hjælper planter.","Alle blomster er gule.","Bier lever i vand."],"a":"Bier hjælper planter.","w":"Pollen flyttes mellem blomster, når bier søger nektar.","t":"Bier samler nektar i blomster. De flytter også pollen, som hjælper mange planter med at danne frø."},{"l":2,"p":"Hvad kan vi slutte?","o":["Øvelse hjalp Liva.","Liva opgav.","Liva skiftede skole."],"a":"Øvelse hjalp Liva.","w":"Fra at vælte til at kunne cykle er der sket udvikling.","t":"Liva øvede sig hver dag på at cykle. Først væltede hun, men efter en uge cyklede hun rundt om skolen."},{"l":2,"p":"Hvilken type tekst er dette?","o":["En opfordring med begrundelse.","Et eventyr.","En vejrudsigt."],"a":"En opfordring med begrundelse.","w":"Teksten beder os gøre noget og begrunder det.","t":"Sluk lyset, når du forlader et tomt rum. Det sparer elektricitet."},{"l":3,"p":"Hvordan hænger teksterne sammen?","o":["Fagteksten forklarer en fordel ved skolehaven.","De handler om fodbold.","Alle insekter er bier."],"a":"Fagteksten forklarer en fordel ved skolehaven.","w":"Den ene beskriver skolehaven, og den anden forklarer, hvad blomster gør.","t":"Opslag: Skolehaven har plads til både elever og insekter.\nFagtekst: Flere forskellige blomster kan tiltrække flere bestøvende insekter."},{"l":3,"p":"Hvad er et godt kritisk spørgsmål?","o":["Hvordan ved de, at alle kan lide det?","Hvilken farve er logoet?","Hvor lang er teksten?"],"a":"Hvordan ved de, at alle kan lide det?","w":"Alle er en stor påstand, som kræver belæg.","t":"En reklame siger: Alle børn elsker vores nye spil! Reklamen fortæller ikke, hvor den viden kommer fra."},{"l":3,"p":"Hvad ved vi med sikkerhed?","o":["Sværdet på museet er en kopi.","Originalen er væk.","Kopien er 800 år gammel."],"a":"Sværdet på museet er en kopi.","w":"Det står direkte, at museet viser en kopi.","t":"Museet viser en kopi af et 800 år gammelt sværd. Originalen opbevares et andet sted."}]},{"id":"genlaes","g":"Læseforståelse","title":"Genlæs og forstå","icon":"🔁","kind":"read","desc":"Læs teksten to gange roligt, og tjek derefter din forståelse.","qs":[{"l":1,"p":"Hvad gør hunden?","o":["Den snuser til et træ.","Den sover.","Den hopper i vandet."],"a":"Den snuser til et træ.","w":"Den sidste sætning fortæller svaret.","t":"Solen står op. Ida tager sine sko på. Hun går ud med sin hund. Hunden snuser til et træ."},{"l":1,"p":"Hvad gør Sara efter at have grebet bolden?","o":["Hun kaster den tilbage.","Hun går hjem.","Hun læser en bog."],"a":"Hun kaster den tilbage.","w":"Læs sidste sætning en gang til.","t":"Ali kaster bolden til Sara. Sara griber den og smiler. Så kaster hun bolden tilbage."},{"l":1,"p":"Hvor går mor og barn hen?","o":["Til biblioteket.","Til stranden.","Til bageren."],"a":"Til biblioteket.","w":"Svaret står direkte.","t":"Mor tager en taske. Hun og Ole går gennem parken. De skal aflevere tre bøger på biblioteket."},{"l":2,"p":"Hvorfor flytter Emma pinden?","o":["For at gøre stien sikker.","For at gemme den.","For at bygge hule."],"a":"For at gøre stien sikker.","w":"Når pinden er væk, kan andre cykle sikkert.","t":"En lille pind ligger midt på cykelstien. Emma tager den op og lægger den ved siden af. Nu kan de andre cykle forbi."},{"l":2,"p":"Hvorfor flyttes regnormen?","o":["For at hjælpe den.","For at tælle fliser.","For at få den til at flyve."],"a":"For at hjælpe den.","w":"Fugtig jord beskytter mod udtørring.","t":"I skolegården ligger en regnorm på fliserne. Børnene lægger den forsigtigt i fugtig jord, så den ikke tørrer ud."},{"l":3,"p":"Hvad gjorde det lettere at finde en bog?","o":["Sortering og skilte.","En højere reol.","At købe alle bøgerne igen."],"a":"Sortering og skilte.","w":"Du skal sammenholde begge handlinger.","t":"Bøgerne står i uorden. Børnene sorterer dem efter emne og sætter skilte på hylderne. Nu er det lettere at finde en god bog."},{"l":3,"p":"Hvad viser historien om Mikkel?","o":["Genlæsning hjalp ham til at rette en fejl.","Han læste aldrig opslaget.","Han kom for sent."],"a":"Genlæsning hjalp ham til at rette en fejl.","w":"Hans første læsning var upræcis, men han kontrollerede igen.","t":"På opslaget står afgang klokken 8.30. Mikkel tror først, at der står 9.30, men læser det igen. Næste morgen er han klar i god tid."}]}];</script><script>
'use strict';
const S=document.getElementById('app'),say=(x)=>document.getElementById('live').textContent=x;
const params=new URLSearchParams(location.search),sites=params.get('sites')==='1';
document.querySelectorAll('[data-home]').forEach(x=>x.href='index.html'+(sites?'?sites=1':''));
let lvl=2,g=null,qs=[],i=0,points=0,first=true,done=false,phase=0,passes=0,selected=[],tiles=[],opts=[],message='',hint=false;
const esc=(x)=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function shuffle(a){const b=a.slice();for(let n=b.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[b[n],b[j]]=[b[j],b[n]];}return b;}
function home(){g=null;let h='<section class="hero"><div><span class="eyebrow">Nyt læse- og staveværksted · 3.C</span><h1>Læs sikkert.<br>Stav stærkere.</h1><p>14 nye træningsspil med lyd, ord, stavning og historier. Vælg niveau, løs opgaverne og prøv igen. Ingen tidspres.</p><div class="chips"><span class="chip">14 nye spil</span><span class="chip">3 niveauer</span><span class="chip">Lydstøtte</span><span class="chip">Ingen login</span></div></div><div class="hero-emoji" aria-hidden="true">📚✨</div></section><div class="levelbox"><h2>Vælg dit niveau</h2><div class="levels">'+[1,2,3].map(n=>'<button class="lvl" aria-pressed="'+(lvl===n)+'" onclick="level('+n+')">'+['','🌱 Basis','🌟 På vej','🚀 Udfordring'][n]+'</button>').join('')+'</div><p class="muted">'+['','Korte ord og tydelige lydmønstre.','Flere mønstre og begyndende fortolkning.','Længere ord, mere krævende læsning og begrundelser.'][lvl]+'</p></div>';
['Afkodning','Stavning','Læseforståelse'].forEach(group=>{const gg=G.filter(x=>x.g===group);h+='<div class="section"><h2>'+group+'</h2><span class="tiny">'+gg.length+' spil</span></div><div class="grid">'+gg.map(x=>'<article class="card"><div class="emoji" aria-hidden="true">'+x.icon+'</div><div class="tiny">'+group+' · '+x.qs.filter(z=>z.l<=lvl).length+' opgaver</div><h3>'+x.title+'</h3><p>'+x.desc+'</p><button class="btn" onclick="start(\''+x.id+'\')">Spil nu →</button></article>').join('')+'</div>';});
h+='<div class="note"><h2>Til læreren</h2><p>Se mål, niveaudeling og forslag til et sammenhængende fireugers træningsforløb.</p><button class="btn light" onclick="teacher()">Åbn lærerguiden →</button></div>';S.innerHTML=h;window.scrollTo(0,0);}
function level(n){lvl=n;home();}
function start(id){g=G.find(x=>x.id===id);qs=shuffle(g.qs.filter(x=>x.l<=lvl));i=0;points=0;prepare();game();window.scrollTo(0,0);}
function prepare(){first=true;done=false;phase=0;passes=0;selected=[];tiles=[];message='';hint=false;const q=qs[i];opts=shuffle(q.o||[]).map((s,k)=>({s,id:k}));if(g.kind==='order'||g.kind==='nonword')opts=shuffle(q.o.map((s,k)=>({s,id:k})));}
function speak(){if(!('speechSynthesis' in window))return say('Oplæsning er ikke tilgængelig i browseren.');const q=qs[i];speechSynthesis.cancel();const s=new SpeechSynthesisUtterance(q.t||q.p);s.lang='da-DK';s.rate=.8;speechSynthesis.speak(s);}
function options(arr){return '<div class="opts">'+arr.map(o=>'<button class="opt" onclick="choose('+0+',\''+encodeURIComponent(o.s).replace(/'/g,'%27')+'\')">'+esc(o.s)+'</button>').join('')+'</div>';}
function game(){if(!g)return;if(i===qs.length)return result();const q=qs[i],kind=g.kind;let h='<div class="gamebar"><button class="btn light" onclick="home()">← Alle spil</button><span class="tiny">Opgave '+(i+1)+' af '+qs.length+' · '+points+' rigtige i første forsøg</span></div><section class="mission"><div class="eyebrow" style="color:#9bded8">DIN LÆSEMISSION</div><h1>'+g.icon+' '+g.title+'</h1><p>'+g.desc+'</p></section><div class="meter"><div style="width:'+Math.round(100*i/qs.length)+'%"></div></div><section class="question"><div class="tiny">Niveau: '+['','Basis','På vej','Udfordring'][lvl]+'</div>';
if(q.t)h+='<div class="passage">'+esc(q.t)+'</div><button class="btn light" onclick="speak()">🔊 Læs teksten højt</button>';
h+='<h2 style="margin-top:16px">'+esc(kind==='evidence'&&phase===1?'Hvilken sætning er det bedste tekstbevis?':kind==='nonword'&&phase===1?'Byg vrøvleordet, du lige læste.':q.p)+'</h2>';
if(kind==='nonword'&&phase===0){h+='<p class="muted">Læs ordet med fingeren under hver lyd. Når du er klar, skjules ordet, og du bygger det selv.</p><div class="passage" style="font-size:clamp(32px,6vw,52px);font-weight:900;letter-spacing:.08em;text-align:center">'+esc(q.a)+'</div><button class="btn secondary" onclick="phase=1;message=\'\';game()">Jeg har læst ordet →</button>';}else if(kind==='order'||kind==='nonword'){h+='<p class="muted">Tryk på brikkerne i den rigtige rækkefølge, eller træk dem til feltet.</p><div class="zone" ondragover="event.preventDefault()" ondrop="drop(event)">'+(tiles.length?tiles.map(v=>'<span class="token">'+esc(v.s)+'</span>').join(''):'<span class="muted">Dine brikker kommer her</span>')+'</div><div class="tiles">'+opts.map((v,k)=>'<button class="tile" draggable="true" ondragstart="drag(event,'+k+')" onclick="tile('+k+')" '+(selected.includes(k)||done?'disabled':'')+'>'+esc(v.s)+'</button>').join('')+'</div><div class="row"><button class="btn secondary" onclick="checkTiles()">Tjek ordet</button><button class="btn light" onclick="selected=[];tiles=[];game()">Forfra</button>'+(kind==='nonword'?'<button class="btn light" onclick="revealNonword()">👀 Se ordet igen</button>':'')+'</div>';}
else if(kind==='write'){h+='<label class="hidden" for="answer">Skriv ordet</label><input id="answer" class="word" autocomplete="off" spellcheck="false" placeholder="Skriv ordet..." onkeydown="if(event.key===\'Enter\')checkWord()"><div class="row"><button class="btn secondary" onclick="checkWord()">Tjek stavning</button></div>';}
else if(kind==='read'&&passes<2){h+='<p class="muted">'+(passes===0?'Læs teksten første gang. Læs roligt og præcist.':'Læs samme tekst igen. Bliver ordene lettere?')+'</p><button class="btn secondary" onclick="passes++;game()">'+(passes===0?'Jeg har læst én gang →':'Jeg har læst igen →')+'</button>';}
else h+=options((kind==='evidence'&&phase===1)?shuffle(q.pro).map((s,k)=>({s,id:k})):opts);
if(message)h+='<div class="feedback '+(done?'':'wrong')+'" role="status">'+(done?'✓ Godt undersøgt!':'Prøv igen.')+'<p>'+esc(message)+'</p></div>';
if(done)h+='<div class="row"><button class="btn" onclick="next()">'+(i===qs.length-1?'Se min afslutning →':'Næste opgave →')+'</button></div>';
h+='</section><p class="muted">Læs hele ordet eller teksten en gang til, hvis du er i tvivl. Det er helt fint at prøve igen.</p>';S.innerHTML=h;}
function drag(e,k){e.dataTransfer.setData('text/plain',String(k));}
function drop(e){e.preventDefault();tile(Number(e.dataTransfer.getData('text/plain')));}
function tile(k){if(done||selected.includes(k)||!opts[k])return;selected.push(k);tiles.push(opts[k]);game();}
function revealNonword(){if(g?.kind!=='nonword'||done)return;first=false;phase=0;game();}
function checkTiles(){if(done)return;const word=tiles.map(x=>x.s).join('');decide(word===qs[i].a,'Tjek rækkefølgen af bogstaver eller stavelser.');}
function checkWord(){if(done)return;const x=(document.getElementById('answer')?.value||'').trim().toLocaleLowerCase('da-DK');decide(x===qs[i].a.toLocaleLowerCase('da-DK'),'Læs ledetråden igen. Tjek hver lyd og hvert bogstav.');}
function choose(n,v){if(done)return;const val=decodeURIComponent(v);const q=qs[i];const needed=g.kind==='evidence'&&phase===1?q.proof:q.a;if(val!==needed)return decide(false,'Se efter et ord eller et tekstspor, som hjælper dig.');if(g.kind==='evidence'&&phase===0){phase=1;message='';game();say('God slutning! Find nu tekstbeviset.');return;}decide(true,'');}
function decide(ok,wrong){if(ok){if(first)points++;done=true;message=qs[i].w;game();say('Rigtigt. '+message);}else{first=false;message=wrong;game();say('Prøv igen. '+wrong);}}
function next(){i++;if(i===qs.length){result();return;}prepare();game();window.scrollTo(0,0);}
function result(){let pct=Math.round(points/qs.length*100);S.innerHTML='<div class="hero"><div><div class="eyebrow">Mission gennemført</div><h1>⭐ Godt arbejdet!</h1><div class="result">'+points+' / '+qs.length+'</div><p>Rigtige svar i første forsøg · '+pct+' %. '+(pct>=80?'Du har godt fat i mønstrene.':pct>=50?'Bliv ved med at øve, så bliver du sikrere.':'Prøv igen i roligt tempo og gerne sammen med en voksen.')+'</p><div class="row"><button class="btn" onclick="start(\''+g.id+'\')">Spil igen ↻</button><button class="btn secondary" onclick="home()">Alle spil →</button></div></div></div><div class="note"><strong>Øvelse er til at lære af.</strong><p>Denne score er ikke en officiel testscore. Ingen svar gemmes eller sendes.</p></div>';window.scrollTo(0,0);}
function teacher(){let txt=[['Uge 1: Sikker lyd og afkodning','10 minutters træning 3–4 gange om ugen. Brug Lydbroen, Vrøvleordsplaneten og Ord på kornet. Lad eleven læse vrøvleordet højt, skjule det og genskabe det lyd for lyd. Modellér: se – sig lyd – sæt sammen – kontrollér.'],['Uge 2: Stavemønstre','Arbejd med Vokaldetektiven, Konsonantkontrol og De skjulte bogstaver. Vælg ét konkret fejlmønster ad gangen.'],['Uge 3: Ordstruktur og bøjning','Brug Stavelsesraketten, Orddelingsmesteren, Bøjningsværkstedet og R-detektiven. Lad eleven forklare sit valg.'],['Uge 4: Forståelse og tekstbeviser','Brug Find tekstens spor og Tekstkompasset. Spørg: Hvad står der? Hvad kan du slutte? Hvilken sætning viser det? Træn genlæsning.']];S.innerHTML='<button class="btn light" onclick="home()">← Spilmenu</button><div class="mission" style="margin-top:18px"><div class="eyebrow" style="color:#9bded8">Til læreren</div><h1>Fagligt træningsforløb</h1><p>To testområder · et sammenhængende støtteforløb</p></div><div class="note"><h2>Sådan bruges opgaverne</h2><p><strong>ST3:</strong> lydanalyse, vokalstavning, konsonantfordobling, stumme bogstaver, bøjningsendelser og stavelses-/orddeling. <strong>National læsetest:</strong> præcision, ordidentifikation, direkte oplysninger, inferens, hovedbudskab og kritisk refleksion.</p><p><strong>Basis</strong> bruges ved usikre lyd-bogstavforbindelser. <strong>På vej</strong> bygger videre med flere stavemønstre. <strong>Udfordring</strong> giver længere ord og mere komplekse tekster. Niveauerne er ikke testkategorier.</p><p>Følg udviklingen med elevens læsning, egne stavninger og tekstsamtaler over 4–6 uger. Spillenes pointtal erstatter ikke en pædagogisk undersøgelse.</p></div><div class="guide">'+txt.map(v=>'<article><h3>'+v[0]+'</h3><p>'+v[1]+'</p></article>').join('')+'</div><div class="note"><h2>Principper</h2><p>Præcision før hastighed. Korte gentagelser. Fejl bruges til forklaring. Ved inferens skal eleven kunne udpege et tekstbevis. Afslut med mundtlig begrundelse eller en selvskrevet sætning.</p><p>Vrøvleordsplaneten træner selvstændig afkodning og hukommelse for bogstavrækkefølge, men erstatter ikke lærerledet auditiv lydanalyse med oplæste vrøvleord. Opgaverne er originale undervisningsopgaver og ikke kopier af ST3 eller de nationale test. Der vises ingen elevnavne eller fortrolige testresultater på den offentlige side.</p></div>';window.scrollTo(0,0);}
home();</script></body></html>
