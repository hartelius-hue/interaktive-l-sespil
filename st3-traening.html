:root{--ink:#1c2b49;--navy:#19274a;--muted:#536883;--cream:#fffaf1;--border:#e0e6f0;--teal:#0d827b;--coral:#dd6149}

x;letter-spacing:-.03em;margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:2px solid #e4e9f0;border-radius:21px;padding:21px;display:flex;flex-direction:column;min-height:238px;box-shadow:0 4px 0 #edf0f3}.card .emoji{display:grid;place-items:center;width:62px;height:62px;background:#e8efff;border-radius:19px;font-size:32px;margin-bottom:12px}.card:nth-child(3n+2) .emoji{background:#f1eaff}.card:nth-child(3n+3) .emoji{background:#fff0d5}.card h3{font-size:20px;letter-spacing:-.02em;line-height:1.2;margin:0 0 8px}.card p{font-size:14px;color:var(--muted);margin:0 0 15px;flex:1}.tiny{font-size:12px;font-weight:850;color:#546785}.btn{border:none;background:var(--coral);border-radius:13px;color:white;font-weight:900;padding:10px 16px;display:inline-block;text-decoration:none;align-self:flex-start}.btn.secondary{background:var(--navy)}.btn.light{background:#eef3f9;color:var(--navy)}.gamebar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:18px}.mission{background:var(--navy);color:#fff;border-radius:22px;padding:23px 28px}.mission h1{font-size:34px;letter-spacing:-.04em;margin:5px 0}.mission p{margin:0;color:#dae5ff;font-size:15px}.meter{height:10px;border-radius:10px;background:#e4ebf5;overflow:hidden;margin:18px 0}.meter div{height:100%;background:#0b8a81;transition:width .2s}.question{background:#fff;border:2px solid var(--border);border-radius:24px;padding:27px;box-shadow:0 8px 26px #1a285210}.question h2{font-size:23px;line-height:1.35;margin:0 0 14px}.passage{white-space:pre-line;background:#f0f5ff;padding:18px 20px;border-left:5px solid #83a6e1;border-radius:12px;line-height:1.75;margin-bottom:17px}.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:15px 0}.opt,.tile{background:#fff;border:2px solid #dce5f0;border-radius:15px;padding:13px 16px;min-height:58px;font-weight:800;color:var(--ink);text-align:left}.opt:hover,.tile:hover{border-color:#7aafa9;background:#f1faf8}.tiles{display:flex;gap:9px;flex-wrap:wrap;margin:15px 0}.tile{min-width:65px;font-size:23px;text-align:center;touch-action:manipulation}.tile:disabled{opacity:.27;cursor:default}.zone{border:2px dashed #a8b6c9;border-radius:16px;min-height:80px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:13px;background:#f8faff}.token{font-size:22px;font-weight:850;color:white;background:var(--navy);border-radius:9px;padding:7px 12px}.word{padding:13px 17px;border:2px solid #c6d3e3;border-radius:13px;width:min(100%,460px);font-size:23px;margin:10px 0}.row{margin-top:14px}.feedback{margin-top:16px;background:#e5f7ed;border:2px solid #b0d9c2;color:#165c41;padding:15px 18px;border-radius:15px}.feedback.wrong{background:#fff5e6;border-color:#f0d4a3;color:#6f500e}.feedback p{margin:4px 0 0;font-size:15px}.result{font-size:56px;font-weight:950;color:var(--navy)}.guide{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-top:15px}.guide article{background:#f2f6fc;padding:18px;border-radius:16px}.guide h3{font-size:17px;margin:0 0 7px}.guide p{font-size:14px;margin:0}footer{color:#64738a;border-top:1px solid #e4e9f0;font-size:12px;padding:20px 0}.hidden{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden}

@media(max-width:520px){.grid,.opts{grid-template-columns:1fr}.card{min-height:0}.hero{padding:24px}.hero h1{font-size:34px}.mission h1{font-size:28px}.brand{font-size:17px}}

.tip-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.tip-item{background:#f4f7fc;border:1px solid #e0e7f0;padding:17px 19px;border-radius:16px}.tip-emoji{font-size:25px;display:block}.tip-item h3{font-size:17px;margin:6px 0}.tip-item p{font-size:14px;color:#405570;margin:0 0 9px}.tip-item small{font-size:12px;color:#61748e;font-weight:750}.game-tip{margin-top:20px;background:#f7f9fd;border:1px solid #d9e2f0;border-radius:13px;padding:14px 16px}.game-tip summary{cursor:pointer;font-weight:850;color:#263b5b}.game-tip p{color:#53657c;font-size:15px;margin:10px 0 0}
@media(max-width:650px){.tip-grid{grid-template-columns:1fr}}

.word-flash{margin:18px auto;background:#e9f2ff;border:2px solid #aecaf0;border-radius:22px;display:grid;place-items:center;text-align:center;min-height:170px;padding:20px 12px;max-width:620px;font-size:clamp(32px,6vw,52px);line-height:1.15;letter-spacing:.015em;font-weight:950;color:#17264a;overflow-wrap:anywhere}
.word-flash.ready{font-size:28px;background:#f4f7fb;border-color:#dee5ee}.reading-prep{padding:24px 26px;background:#f0f6fd;border:2px solid #d7e5f5;border-radius:18px;margin:18px 0}.reading-prep strong{font-size:23px}.reading-prep p{margin:5px 0 0;color:#52677e;font-size:15px}.reading-passage{font-size:clamp(18px,2.4vw,21px);line-height:1.9;letter-spacing:.005em;max-width:720px;margin:15px auto 20px}.speed-result{background:#edf9f4;border:2px solid #bfdccc;border-radius:18px;margin:15px 0;padding:16px 20px}.speed-result strong{color:#225947}.speed-result p{margin:5px 0;font-size:16px}.speed-result small{font-size:12px;color:#596e6b}.reading-passage+.btn{margin-bottom:10px}

.source-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:19px 0 23px}
.source-sheet{position:relative;background:#fffdf7;border:2px solid #ebdbba;box-shadow:0 5px 0 #f2e7cf;border-radius:18px;padding:20px;min-width:0}
.source-sheet:nth-child(2){background:#eef9f7;border-color:#bee0d7;box-shadow:0 5px 0 #d7eee8}
.source-sheet p{font-size:18px;line-height:1.7;margin:16px 0;color:#2b405b}
.source-heading{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}.source-heading strong{font-size:19px}
.source-number{background:#1d365e;color:white;border-radius:100px;font-size:11px;letter-spacing:.08em;font-weight:950;padding:5px 9px}
.source-sheet:nth-child(2) .source-number{background:#177b6b}
.source-listen{font-size:13px;padding:8px 12px}
.claim-board{margin:17px 0 16px;background:#fff0d9;padding:19px 22px;border:2px solid #efcf93;border-radius:16px;box-shadow:0 4px 0 #f5e4bd}
.claim-board span{display:block;font-size:11px;font-weight:900;letter-spacing:.1em;color:#74531f;margin:0 0 8px}
.claim-board strong{display:block;font-size:clamp(19px,2.4vw,24px);line-height:1.35}
.claim-passage{background:#f1f6fe}
.claim-options{grid-template-columns:repeat(3,minmax(0,1fr))}
.claim-options .opt{font-size:15px;min-height:84px;text-align:center}
@media(max-width:760px){.source-grid,.claim-options{grid-template-columns:1fr}.source-sheet{padding:17px}.source-sheet p{font-size:17px}.claim-options .opt{min-height:56px}}

.find-your-path{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;margin:18px 0;padding:19px 23px;background:#fff4dc;border:2px solid #efd9a8;border-radius:20px;box-shadow:0 5px 0 #f3e8d1}
.find-your-path strong{font-size:20px;letter-spacing:-.015em}.find-your-path p{font-size:15px;color:#54657c;margin:4px 0 0}
.find-your-path a{background:#223e67;color:#fff;text-decoration:none;font-weight:900;padding:12px 16px;border-radius:13px;white-space:nowrap}
@media(max-width:580px){.find-your-path{padding:17px}.find-your-path a{width:100%;text-align:center}}

/* Farverigt læseunivers med diskrete, originale animationer */
body{background:radial-gradient(ellipse at 0% 0%,#edeaff,transparent 30%),radial-gradient(ellipse at 100% 17%,#e3faf6,transparent 30%),#fffaf1}
.hero{background:linear-gradient(114deg,#e3f2fe 0%,#eff0ff 55%,#e8fff5 100%);border-color:#cfdff4;box-shadow:0 8px 0 #e0e6f6}
.hero h1{line-height:1.08}.hero h1::first-line{color:#164d79}.hero .eyebrow{letter-spacing:.09em}
.hero-emoji{font-size:83px;filter:drop-shadow(0 13px 6px #3d4a9b24);animation:hero-reader 5s ease-in-out infinite}
@keyframes hero-reader{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(5deg) translateY(-13px)}}
.mystery-shelf{position:relative;display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;border:2px solid #d9c9ef;border-radius:24px;background:linear-gradient(115deg,#faf0ff,#fffdf1);box-shadow:0 6px 0 #ede3f4;padding:19px 25px;margin:22px 0}
.mystery-visual{min-height:155px;position:relative;display:grid;place-items:center}
.mystery-book{display:grid;place-items:center;width:115px;height:126px;background:#265477;color:#fff;border-radius:12px;box-shadow:8px 8px 0 #8ec2e3;font-size:67px;transform:rotate(-13deg);animation:mystery-bob 4.7s ease-in-out infinite}
.mystery-glass{font-size:55px;position:absolute;right:-6px;bottom:0;animation:mystery-search 4.2s ease-in-out infinite}
.mystery-spark{font-size:30px;color:#e2aa37;position:absolute;left:4px;top:0}
@keyframes mystery-bob{0%,100%{transform:rotate(-13deg) translateY(0)}50%{transform:rotate(-8deg) translateY(-9px)}}
@keyframes mystery-search{0%,100%{transform:translate(0,0)}50%{transform:translate(-13px,-12px)}}
.mystery-label{font-size:12px;font-weight:950;letter-spacing:.09em;color:#6a4c92}
.mystery-body h2{font-size:clamp(24px,3vw,32px);letter-spacing:-.035em;line-height:1.15;margin:8px 0}
.mystery-body p{font-size:15px;color:#4c607b;line-height:1.55;margin:0 0 16px}
.mystery-links{display:flex;gap:10px;flex-wrap:wrap}.mystery-links button{border:0;background:#264772;border-radius:12px;padding:11px 14px;font-size:14px;color:#fff;font-weight:900;min-height:45px}
.mystery-links button:nth-child(2){background:#0b8379}.mystery-links button:hover{filter:brightness(1.12)}
.card{box-shadow:0 5px 0 #e6e9f0,0 12px 30px #192b4c12;transition:transform .16s,box-shadow .16s}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 0 #e0e8f0,0 17px 30px #192b4c1b}
.card .emoji{transition:transform .2s}.card:hover .emoji{transform:rotate(-7deg) scale(1.07)}
@media(max-width:620px){.mystery-shelf{grid-template-columns:1fr;gap:5px;padding:20px}.mystery-visual{min-height:92px;max-height:92px;overflow:hidden}.mystery-book{scale:.65}.mystery-glass{right:25%;font-size:42px}.mystery-links button{width:100%}}
@media(prefers-reduced-motion:reduce){.hero-emoji,.mystery-book,.mystery-glass{animation:none!important}}
.show-explanation{display:inline-flex;margin-top:9px;padding:10px 14px;min-height:45px;background:#fff5e0;border:2px solid #e3c88d;color:#5d4325;border-radius:12px;font-weight:850;font-size:15px}.show-explanation:hover{background:#ffebc3}.show-explanation:focus-visible{outline:3px solid #dbaa49;outline-offset:2px}

/* Orddelene kan både klikkes og trækkes; også brugbar på Chromebook */
.morph-help,.vowel-note{padding:13px 16px;background:#f2f7ff;border-left:5px solid #6f9ec9;border-radius:11px;margin:15px 0;color:#264261;font-size:15px;line-height:1.55}
.morph-drop{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;min-height:116px;border:3px dashed #8bc3b9;background:#f1fbf7;border-radius:20px;padding:15px;margin:20px 0;gap:10px}
.morph-tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:15px 0 24px}
.morph-tile,.morph-chosen{border:2px solid #b3c8e2;background:#e8f3ff;border-radius:13px;padding:12px 19px;font-size:clamp(18px,2.5vw,24px);font-weight:900;color:#1c3a58;min-height:57px}
.morph-tile[disabled]{opacity:.35;cursor:default}.morph-tile[aria-pressed="true"]{background:#0c8177;color:white;border-color:#0c8177}
.morph-chosen{background:#fff2d0;border-color:#e7be71}.morph-plus{font-weight:950;font-size:28px;color:#41617d}
.morph-stem{display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap;background:#f1f7fc;border-radius:18px;padding:20px;margin:18px 0}
.morph-stem>span:first-child{font-size:12px;letter-spacing:.1em;font-weight:900;color:#5c7286}
.morph-stem>strong{font-size:clamp(26px,3vw,34px);color:#264868}
.morph-stem .morph-suffix{color:#0b8578}.morph-label{display:block;font-size:17px;font-weight:900;margin:20px 0 6px}
.vowel-note{background:#fff4dd;border-left-color:#d8a54c;font-size:17px}
.vowel-choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}
.vowel-choices button{min-height:75px;border-radius:16px;border:2px solid #b8d4db;background:#eaf4ff;font-size:20px;font-weight:900;color:#203d5e}
.vowel-choices button:first-child{background:#fff0d8;border-color:#dfbc85}
.vowel-reveal{font-size:36px;font-weight:900;color:#25426a;text-align:center;padding:14px}
@media(max-width:560px){.vowel-choices{grid-template-columns:1fr}.morph-stem{gap:8px}.morph-tile{min-height:52px;padding:9px 14px}}

t og senere hjælper dig med at forstå rækkefølgen."},{"l":2,"title":"Den glemte paraply","t":"Mira var næsten nået frem til skolen, da regnen begyndte. Hun stoppede under et træ og kiggede i sin taske. Paraplyen lå stadig hjemme i gangen. Da hun kom ind i klasselokalet, var hendes jakke våd, men bøgerne var tørre i tasken.","p":"Hvorfor bliver Miras jakke våd?","o":["Hun har ikke sin paraply med","Hun har været i svømmehallen","Hun glemmer sin jakke","Tasken er gået i stykker"],"a":"Hun har ikke sin paraply med","w":"Du sammenholder oplysningerne om regnen og den glemte paraply."},{"l":2,"title":"Byttebogen","t":"Skolens bibliotek har fået en byttehylde. Eleverne må tage en brugt bog med hjem, hvis de sætter en anden bog på hylden. Nora tager en bog om rummet og lægger sin gamle dyrebog på hylden. Hun glæder sig til at læse om planeterne.","p":"Hvilken bog lægger Nora på hylden?","o":["Sin gamle dyrebog","Bogen om rummet","En kogebog","En bog om cykler"],"a":"Sin gamle dyrebog","w":"To bøger nævnes. Det er vigtigt at holde styr på, hvilken bog hun lægger fra sig."},{"l":3,"title":"Den lille skolehave","t":"I skolegården har 3.C anlagt en lille have. Eleverne har sået radiser og plantet krydderurter. Hver uge har to elever ansvaret for at vande bedene. Da der ikke kom regn i flere dage, begyndte jorden at tørre. Klassen aftalte derfor en ekstra vandingsdag, så planterne kunne få vand nok.","p":"Hvorfor aftalte klassen en ekstra vandingsdag?","o":["Jorden blev tør, fordi det ikke regnede","De ville bygge en ny skole","De manglede frø","De ville flytte haven"],"a":"Jorden blev tør, fordi det ikke regnede","w":"Du fandt sammenhængen mellem manglende regn, tør jord og vanding."},{"l":3,"title":"Et eksperiment med papirfly","t":"Eleverne bygger to papirfly. Det ene fly har brede vinger, og det andet har smalle. De kaster begge fly fra samme sted og måler, hvor langt de flyver. Efter tre forsøg sammenligner de resultaterne. Flyet med brede vinger flyver længst i to af de tre forsøg. Klassen taler om, hvorfor flere forsøg giver et mere sikkert billede.","p":"Hvorfor laver eleverne flere forsøg?","o":["For at sammenligne resultater mere sikkert","For at få flere fly i skraldespanden","For at undgå at måle","For at finde et nyt klasselokale"],"a":"For at sammenligne resultater mere sikkert","w":"Ved at gentage forsøg kan eleverne bedre vurdere, om et resultat går igen."},{"l":3,"title":"Et nyt skilt ved søen","t":"Ved søen står et nyt skilt: Giv ikke ænderne brød. Skiltet forklarer, at brød ikke er egnet som hovedføde for ænder, og at madrester kan forurene vandet. Tobias læser hele skiltet, før han pakker sin madpakke ud. Han beslutter at spise sit brød selv og bare kigge på ænderne.","p":"Hvorfor giver Tobias ikke ænderne brød?","o":["Han har læst skiltets forklaring","Han har glemt sin madpakke","Ænderne er fløjet væk","Han kan ikke lide brød"],"a":"Han har læst skiltets forklaring","w":"Han bruger en oplysning fra teksten til at vælge, hvad han vil gøre."}]},{"id":"tekstkilder","g":"Læseforståelse","title":"To tekster, én løsning","icon":"🗝️","kind":"sources","desc":"Læs begge tekstkort. Du skal bruge dem begge for at finde svaret.","qs":[{"l":1,"sources":[{"title":"Klubber på skolen","text":"Tirsdag er der tegneklub. Onsdag er der læseklub."},{"title":"Besked fra Amina","text":"Jeg kan kun være med i en klub om onsdagen."}],"p":"Hvilken klub kan Amina være med i?","o":["Læseklubben","Tegneklubben","Begge klubber","Ingen af klubberne"],"a":"Læseklubben","w":"Der står onsdag ved læseklubben. Amina kan kun om onsdagen."},{"l":1,"sources":[{"title":"På biblioteket","text":"Bøger om dyr står på den grønne hylde. Eventyr står på den blå hylde."},{"title":"Elias skriver","text":"Jeg vil finde en bog med fakta om pindsvin."}],"p":"Hvilken hylde skal Elias gå hen til?","o":["Den grønne hylde","Den blå hylde","Begge hylder","Ingen af hylderne"],"a":"Den grønne hylde","w":"Elias vil vide noget om pindsvin. Så skal han finde fagbøgerne om dyr. function drag(e,k){e.dataTransfer.setData('text/plain',String(k));}
function drop(e){e.preventDefault();tile(Number(e.dataTransfer.getData('text/plain')));}
function tile(k){if(done||selected.includes(k)||!opts[k])return;selected.push(k);tiles.push(opts[k]);game();}
function speakDictation(rate){
 if(!g||g.kind!=='dictation'||done)return;
 const info=document.getElementById('audio-info');
 const fail=(msg)=>{if(info)info.textContent=msg;say(msg);};
 if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){
  fail('Der er ingen oplæsning på denne enhed. Spørg en voksen, om de vil læse ordet højt.');return;
 }
 try{
  const voices=speechSynthesis.getVoices();
  const dansk=voices.find(v=>/^da(?:-|_|$)/i.test(v.lang));
  if(voices.length&&!dansk){fail('Her er ingen dansk computerstemme. Spørg en voksen, om I kan slå dansk oplæsning til.');return;}
  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(qs[i].a);
  utterance.lang='da-DK';utterance.rate=rate;utterance.pitch=1;
  if(dansk)utterance.voice=dansk;
  utterance.onerror=()=>fail('Lyden virkede ikke. Prøv igen, eller spørg en voksen.');
  if(info)info.textContent='Hør ordet. Skriv det bagefter.';
  speechSynthesis.speak(utterance);
 }catch(e){fail('Lyden kunne ikke starte. Spørg en voksen om hjælp.');}
}
function checkDictation(){
 if(!g||g.kind!=='dictation'||done)return;
 const input=document.getElementById('answer');
 const typed=(input?.value||'').trim();
 if(!typed){say('Skriv ordet, før du tjekker.');if(input)input.focus();return;}
 if(typed.toLocaleLowerCase('da-DK')===qs[i].a.toLocaleLowerCase('da-DK')){
   decide(true,'');
 }else{
   first=false;message='Hør ordet igen. Sig lydene langsomt, og tjek både begyndelsen, vokalen og slutningen.';
   game();
   const nextInput=document.getElementById('answer');
   if(nextInput){nextInput.value=typed;nextInput.focus();}
   say('Prøv igen. Lyt og ret det, du har skrevet.');
 }
}
function explainTraining(){
 if(!g||done||!message||explanationShown)return;

 explanationShown=true;
 message='Det rigtige svar er: '+answer+'. '+(q.w||'Se på ordet eller teksten igen.');
 game();
}

function morphDrop(e){e.preventDefault();const raw=e.dataTransfer.getData('text/plain');if(!/^\d+$/.test(raw))return;morphPick(Number(raw));}
function morphRemove(j){if(!g||g.kind!=='morphbuild'||done)return;morphPicked.splice(j,1);message='';game();}
function morphReset(){if(!g||g.kind!=='morphbuild'||done)return;morphPicked=[];message='';game();}
function checkMorphBuild(){
 if(g?.kind!=='morphbuild'||done)return;
 if(morphPicked.length!==qs[i].parts.length){say('Vælg to orddele først.');return;}
 const built=morphPicked.map(k=>morphPool[k]).join('');
 decide(built===qs[i].a,'Se på betydningen af de to orddele. Giver dit nye ord mening?');
}
function selectMorphEnding(k){

function checkMorphEnding(){

 const q=qs[i];decide(morphEnding===q.suffix&&morphText===q.a.toLocaleLowerCase('da-DK'),'Læs sætningen. Er det én, flere eller noget bestemt? Se på endelsen, og prøv igen.');
}
function speakVowelWord(){
 if(g?.kind!=='vowelrule'||done)return;

 try{
  const voices=speechSynthesis.getVoices(),da=voices.find(v=>/^da(?:[-_]|$)/i.test(v.lang));
  if(voices.length&&!da){say('Vælg en dansk oplæsningsstemme, eller tryk på Se ordet.');return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(qs[i].a);u.lang='da-DK';u.rate=.83;
  if(da)u.voice=da;speechSynthesis.speak(u);
 }catch(e){say('Lyden virker ikke. Få en voksen til at sige ordet.');}
}

function choose(n,v){if(done)return;const val=decodeURIComponent(v);const q=qs[i];const needed=g.kind==='evidence'&&phase===1?q.proof:q.a;if(val!==needed)return decide(false,'Læs en gang til. Hvilket ord eller hvilken sætning hjælper dig med at finde svaret?');if(g.kind==='evidence'&&phase===0){phase=1;message='';game();say('Det passer. Find nu det sted i teksten, der støtter dit svar.');return;}decide(true,'');}
function decide(ok,wrong){if(ok){if(first)points++;done=true;message=qs[i].w;game();say('Rigtigt. '+message);}else{first=false;message=wrong;game();say('Prøv igen. '+wrong);}}
function next(){clearReadingTimers();i++;if(i===qs.length){result();return;}prepare();game();window.scrollTo(0,0);}
function result(){let pct=Math.round(points/qs.length*100);S.innerHTML='<div class="hero"><div><div class="eyebrow">Mission gennemført</div><h1>⭐ Godt arbejdet!</h1><div class="result">'+points+' / '+qs.length+'</div><p>Rigtige svar ved første forsøg · '+pct+' %. '+(pct>=80?'Du har godt fat i mønstrene.':pct>=50?'Bliv ved med at øve, så bliver du sikrere.':'Prøv igen i roligt tempo og gerne sammen med en voksen.')+'</p><div class="row"><button class="btn" onclick="start(\''+g.id+'\')">Spil igen ↻</button><button class="btn secondary" onclick="home()">Alle spil →</button></div></div></div><div class="note"><strong>Det er godt at øve sig.</strong><p>Pointene viser kun, hvordan det gik i dette spil. Dine svar bliver ikke gemt.</p></div>';window.scrollTo(0,0);}
function teacher(){
const weeks=[["Uge 1 · Fra sproglyd til bogstav","Brug Lyt og stav ordene og Vrøvleordsdiktat til at arbejde med at lytte efter og adskille ordets enkelte lyde (fonemsegmentering). I Lydbroen og Vrøvleordsplaneten øver eleven den modsatte vej: at sætte lyde sammen til ord (lydsyntese). Vis først fremgangsmåden, og lad derefter eleven prøve selv."],["Uge 2 · Sikrere stavemønstre","Vælg én fejltype ad gangen. Brug Konsonantkontrol til først at høre forskel på kort og lang trykstærk vokal og derefter vælge stavemåde. Sammenlign læse/læsse og køle/kølle. Hovedreglen om dobbeltkonsonant gælder især mellem to vokaler, og der er undtagelser. Brug også Vokaldetektiven og De skjulte bogstaver."],["Uge 3 · Stavelser, orddele og endelser","Stavelsesraketten træner stavelser. I Morfemværkstedet bygger eleven sammensatte ord af rodmorfemer og undersøger, hvad delene betyder. I Endelseslaboratoriet vælger eleven en bøjningsendelse og skriver hele ordet. Tal om forskellen på stavelser og morfemer, og brug også R-detektiven."],["Uge 4 · Læseflyd og tekstforståelse","Genlæs en kort tekst, som eleven kan læse med høj sikkerhed. Brug Ordglimt til præcis ordgenkendelse og Læs med flyd til to gennemlæsninger. Tal om tempo, præcision og forståelse. Brug To tekster, én løsning til at sammenholde kilder og Teksttjekkerne til at skelne mellem det, teksten støtter, modsiger og ikke oplyser. Eleverne skal kunne begrunde deres valg."]];
S.innerHTML="\n<button class=\"btn light\" onclick=\"home()\">← Til spilmenuen</button>\n<div class=\"mission\" style=\"margin-top:18px\">\n  <div class=\"eyebrow\" style=\"color:#9bded8\">Til lærer og læsevejleder</div>\n  <h1>Læsevejlederens guide</h1>\n  <p>Fra prøveresultater til målrettet undervisning</p>\n</div>\n<div class=\"note\">\n<h2>Hvad fortæller prøverne os?</h2>\n<p><strong>ST3 Digital</strong> er en diagnostisk staveprøve, der blandt andet giver indblik i elevens stavemønstre og basale lydlige færdigheder. Den kan pege på behov for arbejde med eksempelvis vokaler, konsonantfordobling, stumme bogstaver og auditiv lydanalyse. ST3 måler ikke elevens forståelse af sammenhængende tekster.</p>\n<p><strong>Folkeskolens Nationale Færdighedstest i læsning</strong> bidrager med viden om afkodning og tekstforståelse. Læs resultaterne sammen med elevens højtlæsning, egne staveforsøg og samtaler om tekster. En prøvescore kan vise, hvor det er relevant at undersøge nærmere, men forklarer ikke i sig selv årsagen til en vanskelighed.</p>\n<h2>Et kort øvepas med et tydeligt mål</h2>\n<p>Vælg én færdighed, som eleven skal arbejde med. Vis strategien ved at tænke højt, prøv et par opgaver sammen, og lad så eleven arbejde selv. Afslut med en kort samtale: Hvad gjorde du, da det blev svært? Hvad vil du prøve næste gang?</p>\n<p>Start gerne med 10–15 minutter ad gangen, flere gange om ugen. Brug de tre øveniveauer fleksibelt. <strong>Basis, På vej og Udfordring</strong> er ikke officielle testtrin; vælg efter den måde, eleven løser opgaverne på.</p>\n</div>"+
'<div class="guide">'+weeks.map(w=>'<article><h3>'+esc(w[0])+'</h3><p>'+esc(w[1])+'</p></article>').join('')+'</div>'+
"\n<div class=\"note\">\n<h2>Forskellige færdigheder kræver forskellige strategier</h2>\n<p><strong>Afkodning og stavning:</strong> Når eleven læser, skal skriftens bogstaver og bogstavfølger omsættes til sproglyde. Når eleven staver, skal sproglyde omsættes til bogstaver, samtidig med at eleven bruger sin viden om danske stavemønstre. Begge dele bygger på sikker lyd-bogstavforbindelse, men det er ikke den samme opgave.</p>\n<p><strong>Stavelser og morfemer:</strong> At klappe ordet i stavelser er noget andet end at finde betydningsbærende orddele. I <em>regnjakke</em> kan eleven finde delene <em>regn</em> og <em>jakke</em>. Det er en morfologisk strategi, som kan støtte både ordforståelse og stavning.</p>\n<p><strong>Kort vokal og dobbeltkonsonanter:</strong> Dansk Sprognævns hovedregel er, at en kort, trykstærk vokal som regel efterfølges af dobbeltkonsonant mellem to vokaler. Ved lang vokal skrives der normalt én konsonant. Sammenlign fx læse/læsse og køle/kølle. Vær opmærksom på tryk, konsonantens placering og undtagelser; reglen gælder ikke uden videre for alle ord.</p>\n<p><strong>Tekstforståelse:</strong> Et svar kan stå direkte i teksten, eller eleven kan være nødt til at drage en slutning, en inferens. Ved inferens spørger vi både: Hvad kan du slutte? Og hvad i teksten får dig til at tænke det? Arbejdet med forstyrrende oplysninger og småord som <em>ikke</em>, <em>men</em> og <em>i stedet</em> støtter præcis læsning; det er ikke en selvstændig officiel delprøve.</p>\n<p><strong>Oplæsning som støtte:</strong> I forståelsesopgaver kan oplæsning mindske afkodningskravet, så eleven får bedre mulighed for at arbejde med indholdet. Når formålet derimod er selvstændig ordafkodning, skal eleven også have mulighed for at læse ordet uden oplæsning.</p>\n</div>\n<div class=\"note\">\n<h2>Oplæsningsliste til diktat</h2>\n<p>Brug listen i individuel undervisning eller en lille gruppe. Læs ét ord tydeligt op, og gentag det ved behov. Eleven lytter, siger ordet og forsøger at skrive det uden at se stavemåden.</p>\n<div class=\"guide\">\n<article><h3>Rigtige ord</h3><p><strong>Basis:</strong> sol, kat, mus, fisk, sko, hus<br><strong>På vej:</strong> lampe, kasse, sommer, katte, bane, banan<br><strong>Udfordring:</strong> cykel, paraply, hjul, hånd, hundene, regnbue</p></article>\n<article><h3>Vrøvleord</h3><p><strong>Basis:</strong> mæp, vup, næf, pøm, sæp, nuf<br><strong>På vej:</strong> mælu, fupo, nøpi, sipo, vøma, tæfu<br><strong>Udfordring:</strong> bræpu, kløpi, snæmo, fræmit, grøna, pløset</p></article>\n</div>\n<p>Vrøvleordsdiktaten er en øvelse i at omsætte sproglyde til skrift. En syntetisk stemme kan udtale opdigtede ord forskelligt, og enkelte lydfølger kan skrives på mere end én rimelig måde. Spillet godkender kun den planlagte stavemåde. Brug derfor opgaven til samtale om elevens lydanalyse, ikke til at placere eleven på et testniveau. Ved uklar oplæsning læser en voksen ordet op.</p>\n</div>\n<div class=\"note\">\n<h2>Hvordan følger vi udviklingen?</h2>\n<p>Tag udgangspunkt i få, konkrete mål, og følg op efter 4–6 uger. Se efter, om eleven bliver mere sikker i nye ord med samme stavemønster, kan forklare sine rettelser og bruger tekstbelæg, når en forståelsesopgave kræver det. Supplér med læseobservationer, korte staveprøver og elevens egne tekster.</p>\n<p>Tidsmålingen i Læs med flyd bygger på elevens egen angivelse af, hvornår teksten er læst. Den måler ikke læsefejl eller udtryksfuld højtlæsning (prosodi) og kan ikke sammenlignes direkte med standardiserede normer. I Ordglimt indgår også visuel opmærksomhed og korttidshukommelse, så spillet kan ikke alene bruges som mål for afkodningshastighed. Et højt spilresultat er ikke i sig selv dokumentation for bedre læsning eller stavning. Vigtigst er, om eleven også kan bruge strategien i en ny opgave uden hjælp. Opgaverne her er selvstændigt undervisningsmateriale, ikke officielle opgaver fra ST3 eller de nationale færdighedstest.</p>\n<p>Elevnavne, individuelle prøveresultater og øvrige fortrolige oplysninger indgår ikke i det offentlige spilværksted.</p>\n</div>";
window.scrollTo(0,0);
}
