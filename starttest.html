'use strict';
const DOMAINS=[{"id":"lyde","title":"Lyde og vrøvleord","description":"Kan du sætte lyde sammen og læse ord, du ikke kender?","games":[["vrovle","Vrøvleordsplaneten"],["lydbro","Lydbroen"],["diktat-vrovle","Vrøvleordsdiktat"]],"tip":"Sig lydene en ad gangen. Sæt dem sammen, og læs ordet igen. Begynd med korte ord."},{"id":"ord","title":"Læs ordene rigtigt","description":"Kan du se forskel på ord, der næsten er ens?","games":[["ordblik","Ord på kornet"],["ordglimt","Ordglimt"],["genlaes","Genlæs og forstå"]],"tip":"Læs hele ordet, også de sidste bogstaver. Sammenlign ord, der ligner hinanden."},{"id":"stavning","title":"Vokaler og stavning","description":"Kan du finde de rigtige bogstaver, når du staver?","games":[["dobbelte","Konsonantkontrol"],["vokaler","Vokaldetektiven"],["diktat-ord","Lyt og stav ordene"]],"tip":"Lyt efter kort og lang vokal. Undersøg, hvornår du skal skrive én eller to konsonanter."},{"id":"orddele","title":"Ord og endelser","description":"Kan du bøje ord og finde de små ord i et langt ord?","games":[["morfem-byg","Morfemværkstedet"],["morfem-endelser","Endelseslaboratoriet"],["sammensat","Orddelingsmesteren"]],"tip":"Byg ord af betydningsfulde dele, og skriv selv ordene med de rigtige endelser."},{"id":"fakta","title":"Find svaret i teksten","description":"Kan du finde det sted, hvor svaret står?","games":[["genlaes","Genlæs og forstå"],["tekstkompas","Tekstkompasset"],["flydelaesning","Læs med flyd"]],"tip":"Læs spørgsmålet, og find de ord i teksten, der giver dig svaret."},{"id":"forstaa","title":"Læs mellem linjerne","description":"Kan du finde spor og forstå det, der ikke står direkte?","games":[["tekstspor","Find tekstens spor"],["tekstkilder","To tekster, én løsning"],["teksttjek","Teksttjekkerne"]],"tip":"Læs teksten igen. Find spor, der hjælper dig med at regne svaret ud."}], QUESTIONS=[{"d":"lyde","p":"Sæt lydene m – æ – p sammen. Hvilket vrøvleord får du?","o":["mæp","mep","næp","mæf"],"a":"mæp","t":""},{"d":"lyde","p":"Læs vrøvleordet sæp. Hvilken lyd kommer til sidst?","o":["/p/","/s/","/æ/","/t/"],"a":"/p/","t":""},{"d":"lyde","p":"Hvilket vrøvleord begynder med st?","o":["stæp","spæt","sætp","tæsp"],"a":"stæp","t":""},{"d":"lyde","p":"Hvilket vrøvleord har to stavelser?","o":["nøpi","mæp","vup","stæn"],"a":"nøpi","t":""},{"d":"ord","p":"🚲 Hvilket ord passer til billedet?","o":["cykel","sykel","cykler","cykell"],"a":"cykel","t":""},{"d":"ord","p":"🐑 Hvilket ord passer til billedet?","o":["får","far","for","før"],"a":"får","t":""},{"d":"ord","p":"🌳 Hvilket ord passer til billedet?","o":["træ","tre","tråd","træe"],"a":"træ","t":""},{"d":"ord","p":"🌈 Hvilket ord passer til billedet?","o":["regnbue","regnbur","regnbye","rengbue"],"a":"regnbue","t":""},{"d":"stavning","p":"Jeg lægger mine bøger i en stor ___. Hvilket ord passer?","o":["kasse","kase","kassse","kass"],"a":"kasse","t":""},{"d":"stavning","p":"Katten sover på en blød ___. Hvilket ord passer?","o":["pude","pudde","pide","pade"],"a":"pude","t":""},{"d":"stavning","p":"Vi leger på ___. Hvilket ord passer?","o":["græsset","græset","græssed","græsed"],"a":"græsset","t":""},{"d":"stavning","p":"På himlen ser vi en ___. Hvilket ord passer?","o":["regnbue","rignbue","regnbye","regenbue"],"a":"regnbue","t":""},{"d":"orddele","p":"En bog – flere ___.","o":["bøger","bogen","bøgerne","boger"],"a":"bøger","t":""},{"d":"orddele","p":"Flere hunde – alle ___.","o":["hundene","hunde","hunderne","hunds"],"a":"hundene","t":""},{"d":"orddele","p":"Hvilke to ord er tandbørste sat sammen af?","o":["tand + børste","tan + dbørste","tante + børste","tandbø + rste"],"a":"tand + børste","t":""},{"d":"orddele","p":"Vi skal ___ en historie i morgen.","o":["skrive","skriver","skrivver","skrev"],"a":"skrive","t":""},{"d":"fakta","p":"Hvornår skal klassen mødes?","o":["Klokken ni","Klokken ti","Klokken otte","Klokken elleve"],"a":"Klokken ni","t":"Klassen skal på biblioteket. De mødes klokken ni ved hovedindgangen."},{"d":"fakta","p":"Hvilken farve har vanterne?","o":["Blå","Røde","Grønne","Gule"],"a":"Blå","t":"Maja tager sine blå vanter med ud. Huen ligger i tasken."},{"d":"fakta","p":"Hvad gør børnene først?","o":["De bygger en rampe","De afprøver bilerne","De rydder op","De tegner et kort"],"a":"De bygger en rampe","t":"Børnene bygger først en rampe. Derefter prøver de små biler på rampen."},{"d":"fakta","p":"Hvor tit vander eleverne bedene?","o":["En gang om ugen","Hver dag","En gang om måneden","To gange om dagen"],"a":"En gang om ugen","t":"I skolegården har klassen sået radiser og persille. En gang om ugen vander de bedene."},{"d":"forstaa","p":"Hvordan er vejret sandsynligvis?","o":["Det regner","Det sner","Der er solskin","Det ved vi ikke"],"a":"Det regner","t":"Anna tager sin regnjakke på. Vejret er gråt, og dråber rammer ruden."},{"d":"forstaa","p":"Hvordan har Ali det sandsynligvis?","o":["Han er nervøs","Han er ligeglad","Han er søvnig","Han er sulten"],"a":"Han er nervøs","t":"Ali står ved tavlen. Han ser på sine stikord igen, og hans hjerte banker hurtigt."},{"d":"forstaa","p":"Hvilken klub kan Liva være med i?","o":["Læseklubben","Tegneklubben","Begge klubber","Ingen af klubberne"],"a":"Læseklubben","t":"Klubberne: Tirsdag er der tegneklub. Onsdag er der læseklub.\nLivas besked: Jeg kan kun komme om onsdagen."},{"d":"forstaa","p":"Hvad bør vi spørge om, når vi læser reklamen?","o":["Hvordan ved de, at alle læser hurtigere?","Hvilken farve har reklamen?","Hvor mange bogstaver står der?","Hvor er knappen?"],"a":"Hvordan ved de, at alle læser hurtigere?","t":"En reklame siger: 'Alle elever læser hurtigere med vores spil!' Der står ikke, hvordan virksomheden har undersøgt det."}];
const el=document.getElementById('screen');
const info=document.getElementById('status');
let answers=Array(QUESTIONS.length).fill(null),index=0,stage='start',training=null;
function safe(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'" :'&#39;'}[c]));}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'});}
function intro(){stage='start';document.body.classList.remove('in-test');
 el.innerHTML='<section class="hero"><div><span class="eyebrow">3.C · DIN LÆSEVEJ</span><h1>Hvilke spil passer til dig? 🧭</h1><p>Er du mest sikker i ord, stavning eller tekster? Prøv de 24 opgaver. Bagefter får du forslag til spil, du kan øve dig med.</p><div class="chips"><span class="chip">24 små opgaver</span><span class="chip">6 slags læse- og staveopgaver</span><span class="chip">Tag dig god tid</span></div><div class="actions"><button class="btn" onclick="begin()">Start opgaverne →</button></div></div><div class="mascot" aria-hidden="true">🦉📚</div></section><section class="note"><h2>Sådan gør du</h2><p>Læs spørgsmålet, og vælg et svar. Du kan altid gå tilbage og ændre det. Når du er færdig, får du forslag til spil.</p><p><strong>Du skal ikke skrive dit navn eller logge ind. Vi gemmer ikke dine svar.</strong> Dine svar bliver kun brugt, mens siden er åben. Når du lukker den, er de væk.</p></section><div class="pathcards"><article class="pathcard"><span>🔤</span><strong>Lyde og ord</strong><p>Læs ord, du ikke kender, og læg mærke til bogstaver, der ligner hinanden.</p></article><article class="pathcard"><span>✏️</span><strong>Stavning</strong><p>Find de rigtige bogstaver, og undersøg, hvordan ord er bygget op.</p></article><article class="pathcard"><span>📖</span><strong>Tekster</strong><p>Find svar i teksten, og brug sporene til at læse mellem linjerne.</p></article></div><div class="disclaimer"><strong>Til dig og din lærer:</strong> Opgaverne er lavet for at hjælpe dig med at vælge spil. De er ikke en officiel test. Tal gerne med din lærer om, hvad du skal øve dig på.</div>';
 scrollTop();}
function begin(){stage='questions';index=0;renderQuestion();}
function answer(n){answers[index]=Number(n);renderQuestion();}
function go(delta){if(delta===1&&answers[index]===null){info.textContent='Vælg først et svar.';return;}info.textContent='';
 if(index+delta>=QUESTIONS.length){finish();return;}
 index=Math.max(0,index+delta);renderQuestion();}
function renderQuestion(){stage='questions';document.body.classList.add('in-test');const q=QUESTIONS[index],topic=DOMAINS.find(d=>d.id===q.d);
 let html='<div class="bar-top"><button class="btn light" onclick="index===0?restart():go(-1)">← '+(index===0?'Til forsiden':'Forrige opgave')+'</button><span><strong>Opgave '+(index+1)+' af '+QUESTIONS.length+'</strong></span></div><div class="progress" role="progressbar" aria-label="Opgaver besvaret" aria-valuemin="0" aria-valuemax="'+QUESTIONS.length+'" aria-valuenow="'+index+'"><div style="width:'+(index/QUESTIONS.length*100)+'%"></div></div>';
 html+='<section class="stage"><span class="eyebrow">'+safe(topic.title)+' · del '+(index%4+1)+'/4</span>';
 if(q.t)html+='<div class="passage">'+safe(q.t)+'</div>';
 html+='<h1>'+safe(q.p)+'</h1><div class="answers">'+q.o.map((option,j)=>'<button type="button" class="answer" aria-pressed="'+(answers[index]===j)+'" onclick="answer('+j+')">'+safe(option)+'</button>').join('')+'</div><div class="actions"><button class="btn dark" onclick="go(1)" '+(answers[index]===null?'disabled style="opacity:.5;cursor:not-allowed"':'')+'>'+(index===QUESTIONS.length-1?'Se min træningsvej →':'Næste spørgsmål →')+'</button></div></section>';
 html+='<p class="q-note">Prøv selv. Du har god tid, og du får først svarene at vide, når du er færdig.</p>';
 el.innerHTML=html;scrollTop();}
function scores(){return DOMAINS.map((d,priority)=>{const items=QUESTIONS.map((q,i)=>({q,i})).filter(x=>x.q.d===d.id);const correct=items.filter(x=>x.q.o[answers[x.i]]===x.q.a).length;return {...d,correct,total:items.length,priority};});}
function groupGames(d,level){return d.games.map(([id,title])=>({id,title,url:'st3-traening.html?spil='+encodeURIComponent(id)+'&niveau='+level}));}
function suggestedLevel(correct){return correct<=1?1:correct<=2?2:3;}
function label(correct){return correct<=1?'Det er godt at begynde her':correct===2?'Her kan du øve dig lidt mere':correct===3?'Det her kan du allerede en del af':'Det her kan du rigtig godt';}
function focusList(data){const list=data.slice().sort((a,b)=>a.correct-b.correct||a.priority-b.priority);
 const needs=list.filter(d=>d.correct<=2);
 if(!needs.length)return [list.find(d=>d.id==='forstaa'),list.find(d=>d.id==='orddele'),list.find(d=>d.id==='ord')].filter(Boolean);
 const take=needs.slice(0,3);if(take.length===1){const next=list.find(x=>x.id!==take[0].id);if(next)take.push(next);}
 return take;
}
function finish(){if(answers.some(a=>a===null)){index=answers.findIndex(a=>a===null);renderQuestion();return;}stage='result';document.body.classList.remove('in-test');
 const data=scores(),priorities=focusList(data),top=priorities[0],good=data.filter(x=>x.correct===4);

 const other=data.filter(x=>!priorities.some(d=>d.id===x.id));
 const more=other.map(d=>'<div class="skill"><span class="name">'+safe(d.title)+'</span><div class="meter"><span style="width:'+(d.correct/d.total*100)+'%"></span></div><span class="score">'+d.correct+'/'+d.total+'</span></div>').join('');
 el.innerHTML='<section class="hero"><div><span class="eyebrow">DINE FORSLAG TIL SPIL</span><h1>Her kan du starte 🌟</h1><p>Du er færdig med de 24 opgaver. Her er nogle spil, som passer til det, du kan øve dig mere på. Vælg gerne sammen med din lærer.</p><div class="chips"><span class="chip">🎯 '+priorities.length+' ting at øve</span><span class="chip">🧩 37 spil i værkstedet</span><span class="chip">🔁 Prøv igen om nogle uger</span></div></div><div class="mascot" aria-hidden="true">🦉🗺️</div></section><div class="note"><h2>Dine næste læse- og stavespil</h2><p>Vælg én ting at øve ad gangen. Prøv 10–15 minutter, gerne tre gange om ugen. Start med det første spil, og prøv derefter et andet.</p></div><section class="roadmap" aria-label="Anbefalede læsemissioner">'+menu+'</section><div class="note"><h2>Dit overblik</h2><p>Du har svaret på fire opgaver om hver ting. Tallene hjælper dig med at vælge spil. De er ikke karakterer eller officielle testresultater.</p><div class="skill-bars">'+data.map(d=>'<div class="skill"><span class="name">'+safe(d.title)+'</span><div class="meter"><span style="width:'+(d.correct/d.total*100)+'%"></span></div><span class="score">'+d.correct+'/'+d.total+'</span></div>').join('')+'</div></div><div class="note"><h2>Hvad skal du øve nu?</h2><p>Prøv spillene. Fortæl din lærer, hvad der var svært, og hvad der hjalp dig. Om nogle uger kan I se, hvad du er blevet bedre til.</p><div class="actions"><a class="btn" href="st3-traening.html">Se alle spil →</a><button class="btn dark" onclick="window.print()">🖨️ Udskriv træningsvejen</button><button class="btn light" onclick="restart()">Tag opgaverne igen ↻</button></div></div><div class="disclaimer"><strong>Til læreren:</strong> De 24 opgaver er tænkt som en kort vejviser til undervisningen, ikke som en standardiseret læsetest. Fire opgaver på hvert område giver kun et lille indblik. Brug anbefalingerne sammen med dine egne observationer, elevens stavning og de fortrolige testresultater. Siden spørger ikke om navn og gemmer ikke elevens svar.</div>';
 if(window.Laesemakker?.setAdvice){window.Laesemakker.setAdvice('Din første læsemission',top.tip);}
 scrollTop();}
function restart(){answers=Array(QUESTIONS.length).fill(null);index=0;training=null;intro();}
function getReport(){return training?{domains:training.data.map(d=>({id:d.id,score:d.correct,total:d.total})),focus:training.priorities.map(d=>d.id)}:null;}
window.Laesestart={begin,answer,go,scores,finish,restart,getReport,getQuestions:()=>QUESTIONS.map(q=>({...q}))};
intro();
</script><script src="laesemakker.js" defer></script></body></html>
