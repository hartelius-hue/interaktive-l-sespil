name: Læseværkstedet functionality and visual QA
on:
  push:
    branches: [main]
    paths:
      - 'ordforraad-spil.*'
      - 'index.html'
      - 'starttest.html'
      - 'st3-traening.html'
      - 'starttest-3d.css'
      - 'site-quality.css'
      - 'laesemakker.css'
      - 'design-3d.css'
      - 'laesemakker.js'
      - 'laeringsmaal.js'
      - 'fremgang-3c.js'
      - 'tests/ordforraad-*.mjs'
      - 'tests/site-review-*.mjs'
      - 'tests/progress-evaluation-*.mjs'
      - 'tests/all-games-smoke-browser.mjs'
      - 'assets/3d/banners/**'
      - '.github/workflows/vocabulary-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vocabulary-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Semantic, functionality and privacy checks
        run: |
          node tests/ordforraad-regression.mjs
          node tests/site-review-regression.mjs
          node tests/progress-evaluation-regression.mjs
      - name: Install Chromium for real browser tests
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Start local static web server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/vocab-http.log 2>&1 &
      - name: Browser checks across all levels and mobile
        run: |
          node tests/ordforraad-browser.mjs
          node tests/site-review-browser.mjs
          node tests/progress-evaluation-browser.mjs
          node tests/all-games-smoke-browser.mjs
      - name: Attach visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: laesevaerksted-qa
          path: test-results/
          if-no-files-found: ignore
